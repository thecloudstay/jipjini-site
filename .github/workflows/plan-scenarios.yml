# 도면 분석 실전 시나리오 고리 (2026-11-10)
#   도면 분석 도구(assets/plan_*.js)가 바뀌거나 매일 새벽에, 플랫폼 양식·전달 방식이 다른 합성 도면 10개를 분석해 정답과 견준다.
#   기준(tools/plan_scenarios/baseline.json)보다 나빠지면 실패 — 방금 올린 바뀜이 원인이면 그 바뀜을 자동으로 되돌린다(사이트는 직전 좋은 판으로 복귀).
name: 도면 분석 실전 시나리오
on:
  push:
    branches: [main]
    paths: ['assets/plan_auto.js', 'assets/plan_tools.js', 'assets/plan_style.js', 'tools/plan_scenarios/**']
  schedule:
    - cron: '17 19 * * *'   # 매일 04:17 (한국 시간)
  workflow_dispatch:
permissions:
  contents: write
concurrency: { group: plan-scenarios, cancel-in-progress: false }
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 5 }
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 브라우저 준비
        run: |
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
          sudo apt-get install -y fonts-noto-cjk >/dev/null 2>&1 || true
      - name: 시나리오 10개
        id: scn
        run: node tools/plan_scenarios/run.js --shots scn_shots
      - name: 결과 남기기
        if: always()
        uses: actions/upload-artifact@v4
        with: { name: plan-scenarios, path: "tools/plan_scenarios/last.json\nscn_shots", retention-days: 14 }
      - name: 나빠졌으면 방금 바뀜 되돌리기
        if: failure() && github.event_name == 'push'
        run: |
          MSG="$(git log -1 --pretty=%s)"
          case "$MSG" in *"[자동 되돌림]"*) echo "이미 되돌린 판 — 멈춤"; exit 0;; esac
          # 시험 틀·기준 자체를 바꾼 올림은 되돌리지 않는다(틀이 틀렸을 수 있다)
          if git diff --name-only HEAD~1 HEAD | grep -q '^tools/plan_scenarios/'; then echo "::error::시나리오 실패 — 시험 틀을 함께 바꾼 올림이라 되돌리지 않음."; exit 0; fi
          if git diff --name-only HEAD~1 HEAD | grep -qE '^assets/plan_(auto|tools|style)\.js$'; then
            git config user.name "jipjini-bot"; git config user.email "bot@jipjini.com"
            git revert --no-edit HEAD
            git commit --amend -m "[자동 되돌림] 도면 분석 시나리오 점수가 기준보다 떨어져 직전 바뀜을 되돌림 — $MSG"
            git push
            echo "::error::시나리오 점수가 떨어져 직전 바뀜을 되돌렸습니다."
          else
            echo "::error::시나리오 실패 — 분석 도구 바뀜이 아니라 되돌리지 않음."
          fi
