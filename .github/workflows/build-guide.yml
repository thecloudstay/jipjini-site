name: Build Guide PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/guide-src/**'
      - '.github/workflows/build-guide.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install fonts + weasyprint
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra
          pip install weasyprint

      - name: Build PDF
        run: |
          mkdir -p files
          python -c "from weasyprint import HTML; HTML('assets/guide-src/guide.html').write_pdf('files/jipjini-guide.pdf')"
          ls -la files/

      - name: Commit PDF
        run: |
          git config user.name "jipjini-bot"
          git config user.email "thecloudstay@gmail.com"
          git add files/jipjini-guide.pdf
          git diff --cached --quiet || git commit -m "build: 가이드 카탈로그 PDF 갱신 (jipjini.com 브랜딩)"
          git push
