# 안내서(카탈로그) PDF 만들기 — assets/guide-src/ 가 바뀌면 files/jipjini-guide.pdf 를 다시 만든다
#   2026-11-10: 검토한 화면과 똑같이 나오도록 브라우저(Playwright)로 만든다(예전 방식은 격자 배치를 다르게 그려 모양이 달라질 수 있었다)
name: Build Guide PDF

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'assets/guide-src/**'
      - '.github/workflows/build-guide.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: 글꼴과 브라우저
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q fonts-noto-cjk fonts-noto-cjk-extra
          npm i --no-save playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: PDF 만들기
        run: |
          mkdir -p files
          node assets/guide-src/build.js
          ls -la files/
      - name: 올리기
        run: |
          git config user.name "jipjini-bot"
          git config user.email "thecloudstay@gmail.com"
          git add files/jipjini-guide.pdf
          git diff --cached --quiet || git commit -m "build: 안내서 PDF 갱신"
          git pull -q --rebase
          git push
