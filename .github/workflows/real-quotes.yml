name: 실견적 공개 자동 생성
on:
  schedule:
    - cron: "17 21 * * *"   # 매일 한국시간 06:17
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-quotes
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 실견적 쪽·시세표 생성
        run: |
          set -o pipefail
          python3 tools/gen_real_quotes.py 2>&1 | tee tools/real_quotes_last.log || echo "생성 실패 — 기록 남김" >> tools/real_quotes_last.log
      - name: 반영
        run: |
          git config user.name "jipjini-bot"
          git config user.email "thecloudstay@gmail.com"
          git add -A cases tools/real_quotes_map.json tools/real_quotes_last.log interior-price-table.html sitemap.xml rss.xml gimpo-interior.html incheon-interior.html
          git commit -m "실견적 공개 자동 갱신" || echo "바뀐 것 없음"
          git push
