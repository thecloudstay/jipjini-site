# 2026-11-22 자동화 실패 점검 — 실패가 며칠째인지 data/auto_status.json 에 적는다. 콘솔이 아침에 읽어 텔레그램으로 알린다.
name: 자동화 실패 점검
on:
  workflow_dispatch:
  schedule: [{cron: '40 22 * * *'}]   # 한국 07:40
permissions: {contents: write, actions: read}
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - env: {GH_TOKEN: "${{ github.token }}"}
        run: python3 tools/auto_status.py
      - run: |
          git config user.name "jipjini-bot"; git config user.email "thecloudstay@gmail.com"
          git add data/auto_status.json; git commit -q -m "자동화 점검 기록" || exit 0
          for i in 1 2 3; do git push && break; git pull --rebase origin main; sleep 5; done
