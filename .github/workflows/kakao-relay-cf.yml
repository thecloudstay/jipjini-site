# 2026-10-12 카톡 중계 — 클라우드플레어 워커 자동 배포 (cloudflare/kakao-relay 가 바뀌면)
# 필요한 비밀값: CLOUDFLARE_API_TOKEN (「Edit Cloudflare Workers」 틀로 만든 토큰). 계정이 하나면 계정 번호는 자동으로 잡힌다.
name: kakao-relay-cf
on:
  push:
    branches: [main]
    paths: ["cloudflare/kakao-relay/**", ".github/workflows/kakao-relay-cf.yml"]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 토큰 확인
        env: { T: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: if [ -z "$T" ]; then echo "CLOUDFLARE_API_TOKEN 비밀값이 없습니다"; exit 1; fi
      - name: 워커 올리기
        working-directory: cloudflare/kakao-relay
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx -y wrangler@3 deploy 2>&1 | tee deploy.log
      - name: 확인
        working-directory: cloudflare/kakao-relay
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1); echo "주소: $URL"
          sleep 3; curl -s "$URL?probe=1"; echo
