# 2026-11-17 네이버 블로그 대장: 대표가 초안을 발행했는지 블로그 구독 주소(RSS)에서 찾아 「발행」으로 바꾼다 (하루 세 번)
name: 블로그 발행 확인
on:
  schedule:
    - cron: "17 1,6,11 * * *"   # 한국 10:17 · 15:17 · 20:17
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: blog-ledger
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q pydantic
      - run: python3 tools/blog/blog_ledger.py sync
      - run: |
          git config user.name "jipjini-bot"; git config user.email "thecloudstay@gmail.com"
          git add data/blog-ledger.json
          git commit -m "블로그 대장: 발행 확인" || echo "바뀐 것 없음"
          git pull --rebase -q && git push
