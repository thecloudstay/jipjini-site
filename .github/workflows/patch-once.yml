name: One-shot site patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          python3 - <<'EOF'
          import io

          def patch(path, pairs):
              s = io.open(path, encoding='utf-8').read()
              o = s
              for a, b in pairs:
                  if a in s:
                      s = s.replace(a, b)
                  else:
                      print('MISS', path, a[:40])
              if s != o:
                  io.open(path, 'w', encoding='utf-8').write(s)
                  print('patched', path)

          # 고객 관점 재작성 (박 대표 지시 2026-07-09): 내부 용어(박 대표 콘솔·GAS) 제거
          patch('index.html', [
              ('JIPJINI · GAS 정밀 의뢰서 단일 진입',
               'JIPJINI · 정밀 의뢰서 — 신청은 이것 하나면 됩니다'),
              ('<div style="font-size:12px;color:#c98e7e;font-weight:700;letter-spacing:0.2em;margin-bottom:6px;">제출 후 자동 진행</div>',
               '<div style="font-size:12px;color:#c98e7e;font-weight:700;letter-spacing:0.2em;margin-bottom:6px;">제출하시면 이렇게 진행됩니다</div>'),
              ('① <strong>의뢰서 시트 자동 저장</strong> (박 대표 콘솔에서 즉시 확인)<br>',
               '① <strong>의뢰 내용이 즉시 접수됩니다</strong> (접수 확인 메일 자동 발송)<br>'),
              ('② <strong>자동 견적서 생성</strong> (17공종 단가표 × 공간 실측 기반)<br>',
               '② <strong>입력하신 실측 그대로 견적서가 자동 작성됩니다</strong> (공종별 상세 명세 포함)<br>'),
              ('③ <strong>박 대표 검토 → 24시간 내 카톡 회신</strong> (자재 모델·단가 100% 공개)<br>',
               '③ <strong>담당 코디가 검토 후 24시간 내 카톡으로 보내드립니다</strong> (자재 모델·단가 100% 공개)<br>'),
              ('④ 시공 결정 시 자동 공정표 + 간트차트 공유 URL 발급',
               '④ 진행을 결정하시면 <strong>내 공사 일정표(공정표) 링크</strong>를 드립니다 — 언제든 폰으로 확인'),
              ('간이폼은 가안 정확도가 낮아 박 대표가 결국 카톡으로 다시 모든 정보를 요청해야 합니다. 처음부터 정밀 의뢰서 하나로 받으면 <strong>견적 회신이 더 빠르고 정확</strong>합니다.',
               '간단한 폼으로는 정확한 견적이 나오지 않아, 결국 카톡으로 같은 내용을 다시 여쭤보게 됩니다. 처음부터 정밀 의뢰서 하나로 보내주시면 <strong>견적 회신이 더 빠르고 정확</strong>합니다.'),
          ])
          EOF
      - name: Commit
        run: |
          git config user.name "jipjini-bot"
          git config user.email "thecloudstay@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "copy: 정밀 의뢰서 안내 고객 관점 재작성 (내부 용어 제거)"
          git push
