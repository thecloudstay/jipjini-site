name: One-shot site patch

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-once.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply patches
        run: |
          python3 - <<'EOF'
          import io

          def patch(path, pairs):
              s = io.open(path, encoding='utf-8').read()
              o = s
              for a, b in pairs:
                  if a in s:
                      s = s.replace(a, b)
                  else:
                      print('MISS', path, a[:40])
              if s != o:
                  io.open(path, 'w', encoding='utf-8').write(s)
                  print('patched', path)

          PROMISE_BOX = '''

    <div style="max-width:680px;margin:28px auto 0;padding:20px 22px;background:#f6f8f6;border:1px solid #d8e2d8;border-radius:14px;text-align:center;">
      <div style="font-size:11px;letter-spacing:0.22em;color:#1a472a;font-weight:700;margin-bottom:8px;">JIPJINI PROMISE</div>
      <div style="font-size:18px;font-weight:800;color:#1a472a;line-height:1.5;">집지니 하자 조율 약속</div>
      <div style="font-size:14px;color:#444;line-height:1.7;margin-top:8px;">
        시공 하자의 <strong>책임</strong>은 시공한 기술자·자재상이 직접 집니다 (직거래 원칙).<br>
        그리고 그 <strong>해결 과정</strong>은 — 집지니 코디가 접수부터 재시공 마무리까지 <strong>끝까지 무상으로 조율</strong>합니다.<br>
        <span style="color:#1a472a;font-weight:700;">연결만 하고 사라지는 플랫폼과 다릅니다. 코디는 공사가 끝나도 남습니다.</span>
      </div>
    </div>'''

          # 1) index.html
          patch('index.html', [
              ('<div class="concept-role-who">현장 관리(PM)</div>',
               '<div class="concept-role-who">현장 관리 (원래 건축주 몸)</div>'),
              ('<div class="concept-role-who">PM 파견 <span class="concept-opt-tag">선택</span></div>\n        <div class="concept-role-what">현장 관리가 어려우시면, 그때 집지니가 PM을 파견해 대신 챙겨드립니다.</div>',
               '<div class="concept-role-who">관리대리인 선임 <span class="concept-opt-tag">선택</span></div>\n        <div class="concept-role-what">현장 관리가 어려우시면, 당신을 대리해 현장을 관리할 <strong>관리대리인(집지니 PM)</strong>을 선임하세요. 시공은 각 기술자가, 관리는 대리인이 맡습니다.</div>'),
              ('<div class="tier-point pro"><i class="ti ti-plus"></i><span>자재 옵션 자유 선택 (스드메처럼)</span></div>',
               '<div class="tier-point pro"><i class="ti ti-plus"></i><span>자재 옵션 자유 선택 (스드메처럼)</span></div>\n        <div class="tier-point pro"><i class="ti ti-plus"></i><span><strong>하자 조율 약속</strong> — 책임은 기술자가, 조율은 코디가 끝까지</span></div>'),
          ])
          s = io.open('index.html', encoding='utf-8').read()
          TAGLINE = '<div class="concept-tagline">집지니는 업체처럼 마진을 남기지 않습니다.<br><strong>당신이 스스로 해낼 수 있도록 돕는, 당신 편의 전문가</strong>입니다.</div>'
          if TAGLINE in s and 'JIPJINI PROMISE' not in s:
              s = s.replace(TAGLINE, TAGLINE + PROMISE_BOX)
              io.open('index.html', 'w', encoding='utf-8').write(s)
              print('promise box added')

          # 2) pricing.html
          patch('pricing.html', [
              ('<strong style="color: var(--jp-dark); font-weight: 500;">SERVICE #2 · PM 파견 (선택)</strong>',
               '<strong style="color: var(--jp-dark); font-weight: 500;">SERVICE #2 · 관리대리인 선임 — 집지니 PM (선택)</strong>'),
              ('PM은 <strong>현장 책임 관리(공정 조율·진행 보고·이슈 발견)</strong>을 담당합니다. 직접 수리가 아닌 발견·조율·보고가 역할이며, 자재·시공 하자의 보증은 자재상·기술자에게 있습니다.',
               'PM 방식은 <strong>관리대리인 선임계약</strong>입니다 — 집지니 PM은 건축주를 대리해 현장을 관리(공정 조율·진행 보고·이슈 발견)하는 관리대리인이며, 시공자가 아닙니다. 자재·시공 하자의 책임은 자재상·기술자에게 있고, 그 해결 조율은 코디가 끝까지 무상 지원합니다 (하자 조율 약속).'),
              ('* PM 파견만 원하시는 분은 별도 연락 부탁드립니다.',
               '* 관리대리인(PM) 선임만 원하시는 분은 별도 연락 부탁드립니다.'),
              ('<div class="sec-head"><p class="eyebrow">AFTER-SERVICE</p><h2>입주 후 12개월 A/S</h2><p>솔직하게 공개합니다. <span class="emph">무료와 유료의 경계</span>를 분명히.</p></div>',
               '<div class="sec-head"><p class="eyebrow">JIPJINI PROMISE</p><h2>집지니 하자 조율 약속<br><span style="font-size:0.65em;font-weight:500;color:#666;">책임은 기술자가, 조율은 코디가 — 끝까지, 무상으로</span></h2><p>입주 후 12개월 집중 지원 + 이후에도 조율은 계속됩니다. <span class="emph">무료와 유료의 경계</span>도 솔직하게 공개합니다.</p></div>'),
          ])

          # 3) workflow.html
          patch('workflow.html', [
              ('시간·경험이 부담되시면 <strong>PM 파견</strong>을 선택하세요.',
               '시간·경험이 부담되시면 <strong>관리대리인 선임(집지니 PM)</strong>을 선택하세요.'),
              ('(3개 이상 해당 시) PM 파견을 고려해 보세요.',
               '(3개 이상 해당 시) 관리대리인 선임(집지니 PM)을 고려해 보세요.'),
              ('하자 점검 후 입주, <strong>12개월 통합 A/S</strong>를 제공합니다. 코디·PM이 책임 기술자 호출을 코디네이팅합니다.',
               '하자 점검 후 입주 — <strong>집지니 하자 조율 약속</strong>이 시작됩니다. 책임은 시공한 기술자·자재상이, 해결 조율(접수·기술자 호출·재시공 일정)은 코디가 끝까지 무상으로. 12개월 집중 지원 + 이후에도 조율은 계속됩니다.'),
          ])

          # 4) about.html
          patch('about.html', [
              ('다만 규모가 크거나 시간이 어려우시면 PM 파견을 선택하실 수 있습니다.',
               '다만 규모가 크거나 시간이 어려우시면 관리대리인 선임(집지니 PM)을 선택하실 수 있습니다.'),
          ])
          EOF
      - name: Commit
        run: |
          git config user.name "jipjini-bot"
          git config user.email "thecloudstay@gmail.com"
          git add -A
          git diff --cached --quiet || git commit -m "brand: 집지니 하자 조율 약속 + 관리대리인 선임(PM) 표기 일괄 반영"
          git push
