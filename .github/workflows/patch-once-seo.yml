name: patch-once-seo
on:
  push:
    paths:
      - 'patch_seo.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_seo.py
      - run: |
          git config user.name "jipjini-bot"
          git config user.email "thecloudstay@gmail.com"
          git add -A
          git commit -m "site: A안 일괄 패치 — 반셀프 어휘·숫자 통일·request.html 링크·FAQ 스키마 [skip ci]" || echo "no changes"
          git push
