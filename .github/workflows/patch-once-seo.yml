name: patch-once-seo
on:
  push:
    paths:
      - 'patch_seo.py'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 patch_seo.py
      - run: |
          git config user.name "jipjini-bot"
          git config user.email "thecloudstay@gmail.com"
          git add index.html
          git commit -m "seo: index title/description 네이버 40/80자 기준 최적화 [skip ci]" || echo "no changes"
          git push
