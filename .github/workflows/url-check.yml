# 2026-10-22 점검용: 주소 하나를 받아 응답 시간·머리글·앞부분을 check 가지에 남긴다 (카톡 미리보기 같은 바깥 확인용)
name: url-check
on:
  workflow_dispatch:
    inputs:
      url: { description: "확인할 주소", required: true }
      ua: { description: "기기 이름(User-Agent)", required: false, default: "facebookexternalhit/1.1" }
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: 받기
        env: { U: "${{ github.event.inputs.url }}", A: "${{ github.event.inputs.ua }}" }
        run: |
          mkdir out
          curl -sL -o out/body.html -D out/head.txt -w "코드 %{http_code} · 걸린초 %{time_total} · 최종주소 %{url_effective}\n" -A "$A" "$U" > out/meta.txt || true
          curl -sL -o out/body2.html -w "두번째 코드 %{http_code} · 걸린초 %{time_total}\n" -A "$A" "$U" >> out/meta.txt || true
          head -c 3000 out/body.html > out/body_head.html
          cd out && git init -q -b check && git config user.name jipjini-bot && git config user.email thecloudstay@gmail.com && git add meta.txt head.txt body_head.html && git commit -qm "점검 $(date -u +%FT%TZ)" && git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" check
