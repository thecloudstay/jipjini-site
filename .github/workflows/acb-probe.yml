name: 아관비 연결 확인
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          B=https://apis.data.go.kr/1613000
          for svc in AptCmnuseManageCostServiceV3 AptRepairsCostServiceV3 AptIndvdlzManageCostServiceV3 AptIndvdlzManageCostServiceV2 AptIndvdlzManageCostService; do
            for f in getHsmpLaborCostInfo getHsmpCleaningCostInfo getHsmpGuardCostInfo getHsmpElevatorMntncCostInfo getHsmpRepairsCostInfo getHsmpConsignManageFeeInfo getHsmpTaxdueInfo getHsmpFacilityMntncCostInfo \
                     getHsmpMonthUseCostInfo getHsmpMonthUseAmountInfo getHsmpLtsmRepairsBalanceInfo getHsmpBalanceInfo getHsmpAccmRateInfo getHsmpMonthImpCostInfo getHsmpMonthLevyCostInfo getHsmpMonthLevyAmountInfo \
                     getHsmpHeatCostInfo getHsmpHotWaterCostInfo getHsmpElectricityCostInfo getHsmpWaterCostInfo getHsmpGasRentalFeeInfo getHsmpPurifTankCostInfo getHsmpScrapFeeInfo getHsmpPreMeetCostInfo; do
              for sfx in "" V3 V2; do
                r=$(curl -s -m 15 "$B/$svc/$f$sfx?serviceKey=x&kaptCode=A10027118&searchDate=202509" | grep -oE "<returnReasonCode>[0-9]+|resultCode\":\"[0-9]+|SERVICE_KEY_IS_NOT_REGISTERED|NO_OPENAPI_SERVICE" | head -1)
                case "$r" in *NO_OPENAPI*|*">12") ;; *) echo "$svc/$f$sfx => $r";; esac
              done; done; done
          echo 끝
