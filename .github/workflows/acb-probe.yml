name: 아관비 연결 확인
on: { workflow_dispatch: {} }
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - run: |
          for u in "https://apis.data.go.kr/1613000/AptLtsmRprFeeInfoService/getHsmpMonthUseAmountInfo?serviceKey=x&kaptCode=A10027118&searchDate=202509" \
                   "https://www.k-apt.go.kr/web/board/webReference/boardView.do?seq=21&boardSecret=0&boardType=03&pageNo=1&keyword=&board_pwd=&scodeT=03" \
                   "https://www.data.go.kr/data/3039714/fileData.do"; do
            echo "== $u"; curl -s -m 30 -o /tmp/o -w "%{http_code} %{size_download}\n" "$u"; head -c 400 /tmp/o; echo; done
          curl -s -m 40 "https://www.k-apt.go.kr/web/board/webReference/boardView.do?seq=21&boardSecret=0&boardType=03&pageNo=1&keyword=&board_pwd=&scodeT=03" | grep -oE "(fileDown[^\"']*|atchFile[^\"']*|\.xlsx[^\"'<]*|download[^\"']{0,120})" | head -40
