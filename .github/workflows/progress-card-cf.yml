# 2026-10-12 진행 현황 미리보기 카드 — 클라우드플레어 워커 자동 배포 (cloudflare/progress-card 가 바뀌면)
# 필요한 비밀값: CLOUDFLARE_API_TOKEN (「Edit Cloudflare Workers」 틀로 만든 토큰). 계정이 하나면 계정 번호는 자동으로 잡힌다.
name: progress-card-cf
on:
  push:
    branches: [main]
    paths: ["cloudflare/progress-card/**", ".github/workflows/progress-card-cf.yml"]
  workflow_dispatch: {}
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - name: 토큰 확인
        env: { T: "${{ secrets.CLOUDFLARE_API_TOKEN }}" }
        run: if [ -z "$T" ]; then echo "CLOUDFLARE_API_TOKEN 비밀값이 없습니다"; exit 1; fi
      - name: 저장소(KV) 준비
        working-directory: cloudflare/progress-card
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          A="$CLOUDFLARE_ACCOUNT_ID"; H="Authorization: Bearer $CLOUDFLARE_API_TOKEN"
          ID=$(curl -s -H "$H" "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces?per_page=100" | jq -r '.result[]?|select(.title=="jipjini-progress-card")|.id' | head -1)
          if [ -z "$ID" ]; then ID=$(curl -s -X POST -H "$H" -H 'content-type: application/json' -d '{"title":"jipjini-progress-card"}' "https://api.cloudflare.com/client/v4/accounts/$A/storage/kv/namespaces" | jq -r '.result.id'); fi
          if [ -z "$ID" ] || [ "$ID" = null ]; then echo "::error::KV 저장소를 만들 수 없음 (토큰에 Workers KV 편집 권한 필요)"; exit 1; fi
          printf '\n[[kv_namespaces]]\nbinding = "CARD"\nid = "%s"\n' "$ID" >> wrangler.toml; echo "::notice::KV $ID"
      - name: 워커 올리기
        working-directory: cloudflare/progress-card
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -o pipefail
          npx -y wrangler@3 deploy 2>&1 | tee deploy.log || { tail -c 1500 deploy.log | tr '\n' ' ' | sed 's/^/::error::/' ; echo; exit 1; }
          echo "::notice::$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1)"
      - name: 확인
        working-directory: cloudflare/progress-card
        run: |
          URL=$(grep -oE 'https://[a-z0-9.-]+\.workers\.dev' deploy.log | head -1); echo "주소: $URL"
          sleep 3; R=$(curl -s "$URL?probe=1"); echo "::notice::확인 $R"
