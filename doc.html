<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>집지니 · 요청 서류</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
:root{--charcoal:#2A2A2A;--gray:#6B6B6B;--line:#E2DCCD;--oat:#F5F1E8;--oat-soft:#FBF8F1;--clay:#9a5a4a;--sans:'Pretendard','Apple SD Gothic Neo',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--oat-soft);font-family:var(--sans);color:var(--charcoal);-webkit-font-smoothing:antialiased}
.wrap{max-width:640px;margin:0 auto;padding:28px 16px 64px}
.brand{font-weight:800;font-size:14px;color:var(--clay);letter-spacing:2px}
h1{font-size:22px;margin:10px 0 4px}
.sub{font-size:13px;color:var(--gray);line-height:1.7}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:15px;margin-bottom:10px}
.card img{width:100%;border:1px solid var(--line);border-radius:8px;display:block}
.btn{display:flex;align-items:center;justify-content:center;gap:6px;width:100%;font:inherit;font-size:14px;font-weight:600;background:var(--clay);color:#fff;border:0;border-radius:10px;padding:12px;margin-top:10px;cursor:pointer}
.btn:disabled{opacity:.5}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.note{background:var(--oat);border-radius:12px;padding:12px 14px;margin-top:14px;font-size:12.5px;line-height:1.7;color:#4a4a4a}
.err{text-align:center;padding:80px 0;color:var(--gray);line-height:1.9}
.load{font-size:13px;color:var(--gray);padding:20px 0;text-align:center}
</style>
</head>
<body>
<svg style="display:none" aria-hidden="true"><symbol id="i-down" viewBox="0 0 24 24"><path d="M12 4v11M7 10l5 5 5-5M5 20h14"/></symbol></svg>
<div class="wrap" id="app"><div class="err">서류를 불러오는 중입니다…</div></div>
<script>
(function(){
  var API='https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec';
  var t=(new URLSearchParams(location.search).get('t')||'').replace(/[^A-Za-z0-9]/g,''), app=document.getElementById('app');
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function get(kind){return fetch(API+'?type=bizdoc&t='+encodeURIComponent(t)+(kind?'&kind='+encodeURIComponent(kind):''),{redirect:'follow'}).then(function(r){return r.json()})}
  function fail(m){app.innerHTML='<div class="err">'+esc(m||'링크가 올바르지 않습니다.')+'<br>집지니 코디에게 다시 요청해 주세요.</div>'}
  function blobOf(j){var b=atob(j.data),u=new Uint8Array(b.length);for(var i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return new Blob([u],{type:j.mime||'application/octet-stream'})}
  if(t.length!==16){fail();return}
  get('').then(function(d){
    if(!d||!d.ok){fail(d&&d.err);return}
    var h='<div class="brand">JIPJINI</div><h1>요청하신 서류</h1><div class="sub">'+(d.고객명?esc(d.고객명)+' 고객님, ':'')+'집지니 서류를 확인하시고 필요하면 내려받아 주세요.<br>이 링크는 '+esc(d.만료)+'까지 열립니다.</div>';
    (d.종류||[]).forEach(function(k,i){h+='<div class="card"><h2>'+esc(k)+'</h2><div id="v'+i+'" class="load">불러오는 중…</div><button class="btn" id="b'+i+'" disabled><svg class="ico"><use href="#i-down"/></svg>내려받기</button></div>'});
    h+='<div class="note">계약서 작성·세금계산서 발행·거래명세서 확인 용도로만 사용해 주시고, 다른 곳에 공유는 삼가 주세요.<br>문의: 집지니 코디 <a href="tel:'+esc(d.코디연락처)+'">'+esc(d.코디연락처)+'</a></div>';
    app.innerHTML=h;
    (d.종류||[]).forEach(function(k,i){
      get(k).then(function(j){
        if(!j||!j.ok)throw new Error(j&&j.err);
        var bl=blobOf(j),url=URL.createObjectURL(bl),v=document.getElementById('v'+i),b=document.getElementById('b'+i);
        v.innerHTML=/^image\//.test(j.mime)?'<img src="'+url+'" alt="'+esc(k)+'">':'<div class="load">'+esc(j.이름)+' (문서 파일)</div>';
        b.disabled=false;b.onclick=function(){var a=document.createElement('a');a.href=url;a.download=j.이름||k;document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},1000)};
      }).catch(function(e){document.getElementById('v'+i).textContent='불러오지 못했습니다: '+(e.message||'')});
    });
  }).catch(function(){fail('잠시 연결이 원활하지 않습니다. 새로 고침해 주세요.')});
})();
</script>
</body>
