<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>집지니 · 견적서</title>
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--charcoal:#2A2A2A;--gray:#6B6B6B;--line:#E2DCCD;--oat:#F5F1E8;--oat-soft:#FBF8F1;--clay:#9a5a4a;--white:#fff;
--serif:'Nanum Myeongjo',serif;--sans:'Pretendard','Apple SD Gothic Neo',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--oat-soft);font-family:var(--sans);color:var(--charcoal);-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
.wrap{max-width:720px;margin:0 auto;padding:32px 16px 72px}
.brand{font-family:var(--serif);font-weight:800;font-size:15px;color:var(--clay);letter-spacing:2px}
h1{font-family:var(--serif);font-weight:800;font-size:26px;line-height:1.4;margin:10px 0 6px}
.meta{font-size:13px;color:var(--gray);line-height:1.7}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px}
.card h2{font-family:var(--serif);font-size:16px;margin-bottom:10px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;font-size:14px;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:none}.kv span:first-child{color:var(--gray)}.kv b{font-weight:600;text-align:right}
.total{background:var(--charcoal);color:var(--oat-soft);border-radius:14px;padding:18px 16px;margin-top:16px}
.total .kv{border-color:#555}.total .kv span:first-child{color:#cfc9bb}.total .big{font-family:var(--serif);font-size:23px}
details{border-bottom:1px solid var(--line)}details:last-child{border-bottom:none}
summary{list-style:none;cursor:pointer;display:flex;gap:8px;padding:12px 0;font-weight:600;font-size:15px}
summary::-webkit-details-marker{display:none}summary span:last-child{margin-left:auto}
summary::after{content:'＋';color:var(--gray)}details[open] summary::after{content:'－'}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px;margin:4px 0 10px}
.tbl th{background:var(--oat);font-weight:600;padding:6px 4px;text-align:left;color:var(--gray)}
.tbl td{padding:6px 4px;border-bottom:1px solid var(--line);vertical-align:top}
.tbl .r{text-align:right;white-space:nowrap}.tbl .sp{display:block;color:var(--gray);font-size:11.5px}
.tabs{display:flex;gap:6px;margin-top:16px;position:sticky;top:0;background:var(--oat-soft);padding:8px 0;z-index:5}
.tab{flex:1;text-align:center;padding:10px 0;border:1px solid var(--line);border-radius:10px;font-size:14px;font-weight:600;color:var(--gray);background:#fff;cursor:pointer}
.tab.on{background:var(--charcoal);color:var(--oat-soft);border-color:var(--charcoal)}
.pane{display:none}.pane.on{display:block}
.ph{display:flex;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}.ph:last-child{border-bottom:none}
.ph .d{min-width:96px;font-size:12.5px;color:var(--clay);font-weight:600;line-height:1.5}
.ph b{display:block;font-size:14.5px}.ph span{font-size:13px;color:var(--gray)}
.bar{height:8px;background:var(--oat);border-radius:4px;margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--clay)}
.note{background:var(--oat);border-radius:12px;padding:14px 16px;margin-top:14px;font-size:13.5px;line-height:1.75}
.note li{margin-left:18px}
.cta{display:block;text-align:center;margin-top:18px;background:var(--clay);color:#fff;text-decoration:none;font-weight:700;padding:16px;border-radius:12px;font-size:16px}
.foot{font-size:12px;color:var(--gray);text-align:center;margin-top:28px;line-height:1.8}
.err{text-align:center;padding:80px 0;color:var(--gray);line-height:1.9}
.tip{margin-top:8px;font-size:12px;color:#7B5E00;background:#FFF8E1;border:1px solid #FFD966;border-radius:8px;padding:8px 10px;line-height:1.6}
.tools{display:flex;gap:8px;margin-top:12px}.tools a,.tools button{flex:1;font:inherit;font-size:13.5px;font-weight:600;color:var(--charcoal);background:#fff;border:1px solid var(--line);border-radius:10px;padding:11px 8px;text-align:center;text-decoration:none;cursor:pointer}
@media print{body{background:#fff}.wrap{max-width:none;padding:0}.tabs,.tools,.cta{display:none}.pane{display:block !important}.pane+.pane{margin-top:18px}details{break-inside:avoid}details:not([open])>*:not(summary){display:block}summary::after{content:''}.total{-webkit-print-color-adjust:exact;print-color-adjust:exact}.card{break-inside:avoid}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">견적서를 불러오는 중입니다…</div></div>
<script>
(function(){
  var app=document.getElementById('app');
  var id=(new URLSearchParams(location.search).get('id')||'').replace(/[^A-Za-z0-9_-]/g,'');
  function won(n){return Math.round(n).toLocaleString('ko-KR')+'원'}
  function num(n){return (Math.round(n*100)/100).toLocaleString('ko-KR')}
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  function md(d){var p=d.split('-');return (+p[1])+'월 '+(+p[2])+'일'}
  // 2026-10-04 카톡·네이버·인스타 등 앱 안 브라우저는 window.print() 가 동작하지 않는다 → PDF 열기 / 바깥 브라우저로 열기
  var CUR_PDF='';
  function inApp(){return /KAKAOTALK|NAVER\(inapp|Instagram|FBAN|FBAV|Line\/|DaumApps|everytimeApp/i.test(navigator.userAgent)}
  function openExternal(u){
    if(/KAKAOTALK/i.test(navigator.userAgent)){location.href='kakaotalk://web/openExternal?url='+encodeURIComponent(u);return true}
    if(/Line\//i.test(navigator.userAgent)){location.href=u+(u.indexOf('?')>=0?'&':'?')+'openExternalBrowser=1';return true}
    return false
  }
  function openPdf(u){
    u=u||CUR_PDF;if(!u)return false;
    if(inApp()&&openExternal(u))return false;
    var a=document.createElement('a');a.href=u;a.target='_blank';a.rel='noopener';document.body.appendChild(a);a.click();setTimeout(function(){a.remove()},500);return false
  }
  function printQuote(){
    if(inApp()){
      if(CUR_PDF){openPdf(CUR_PDF);return}
      if(openExternal(location.href))return;
      alert('앱 안 브라우저에서는 인쇄가 되지 않습니다. 오른쪽 위 메뉴에서 「다른 브라우저로 열기」를 눌러 주세요.');return
    }
    try{window.print()}catch(e){if(CUR_PDF)openPdf(CUR_PDF)}
  }
  function fail(){app.innerHTML='<div class="err">견적서를 찾을 수 없습니다.<br>링크가 정확한지 확인해 주시거나<br>카카오톡 채널 <b>@집지니</b>로 문의해 주세요.<a class="cta" href="https://pf.kakao.com/_NjpxhC/chat">카톡 상담하기</a></div>'}
  if(!id){fail();return}
  // 실시간 데이터: 코디 콘솔 시트에서 바로 읽는 조회 웹앱 (「집지니 카톡봇」 프로젝트 quote_api.gs). 비어 있으면 사이트 JSON만 사용.
  var QUOTE_API='https://script.google.com/macros/s/AKfycbyTMw196qwKBmpz_TA3erW4OcBsmRFWTYioecO5evjq4poPOEXpyqkSKZZ91eTHWUI-/exec'; // 집지니 카톡봇 웹앱 ?q=토큰 (2026-10-01)
  function getStatic(){return fetch('/q/'+id+'.json',{cache:'no-store'}).then(function(r){if(!r.ok)throw 0;return r.json()})}
  function getLive(){if(!QUOTE_API)return Promise.resolve(null);return fetch(QUOTE_API+'?q='+encodeURIComponent(id)+'&v=1',{redirect:'follow'}).then(function(r){return r.json()}).then(function(j){return j&&j.ok?j:null}).catch(function(){return null})}
  // 2026-10-01: 사이트 JSON을 먼저 그리고(0.3초), 콘솔 실시간 데이터가 오면 다시 그림 — 조회 웹앱이 느려도(첫 호출 수 초) 빈 화면이 없다
  function merge(s,l){
    var d=s||{};
    if(l){['name','quoteId','date','pm','total','codiRate','codi','sections','schedule','techs','alternatives','pdfUrl','pdfDownload','lump','plan'].forEach(function(k){if(l[k]!=null&&(!(l[k] instanceof Array)||l[k].length))d[k]=l[k]});d.live=true}
    return d;
  }
  var rendered=false;
  function render(d){
    rendered=true;
    var keep=(document.querySelector('.tab.on')||{}).dataset;keep=keep&&keep.p;
    var t=d.total,codi=Math.round((d.codi||0)*1.1),pm=Math.round((d.pm||0)*1.1);   // 2026-10-04 집지니 운영비는 부가세 포함 금액으로 표시
    var sum=d.lump?   // 2026-10-05 일괄(집지니 수납): 공사 총액 한 줄
      '<div class="total"><div class="kv"><span>자재 + 인건비</span><b>'+won(t)+'</b></div>'+
      '<div class="kv"><span>코디·현장 조율 (부가세 포함)</span><b>'+won(codi+pm)+'</b></div>'+
      '<div class="kv"><span>공사 총액 (부가세 포함 · 집지니에 한 번에)</span><b class="big">'+won(t+codi+pm)+'</b></div>'+
      (d.plan&&d.plan.length?d.plan.map(function(x,i){return'<div class="kv"><span>결제 '+(i+1)+'회 · '+esc(x['시점'])+'</span><b>'+won(x['금액'])+'</b></div>'}).join(''):'<div class="kv"><span>결제</span><b>착공 전 50% · 완공 확인 후 50%</b></div>')+'</div>'
    :'<div class="total"><div class="kv"><span>시공비 (자재+인건비, 마진 0%)</span><b>'+won(t)+'</b></div>'+
      '<div class="kv"><span>코디 운영비 ('+(d.codiRate*100).toFixed(1).replace('.0','')+'%, 정찰제, 부가세 포함)</span><b>'+won(codi)+'</b></div>'+
      (pm?'<div class="kv"><span>현장관리(PM 파견, 부가세 포함)</span><b>'+won(pm)+'</b></div>':'')+
      '<div class="kv"><span>예상 합계</span><b class="big">'+won(t+codi+pm)+'</b></div>'+
      (pm?'<div class="kv"><span>현장관리 미선택 시</span><b>'+won(t+codi)+'</b></div>':'')+
      ((d.alternatives||[]).map(function(a){return'<div class="kv"><span>'+esc(a.label)+' (시공 '+won(a.total)+')</span><b>'+won(a.total+Math.round(a.codi*1.1))+'</b></div>'}).join(''))+'</div>';
    var gap='<div class="card"><h2>견적서 갑지 · 공종별 총괄표</h2><table class="tbl"><tr><th>공종</th><th class="r">항목</th><th class="r">금액</th><th class="r">비중</th></tr>';
    d.sections.forEach(function(s){gap+='<tr><td>'+esc(s.trade)+'</td><td class="r">'+s.lines.length+'</td><td class="r">'+won(s.subtotal)+'</td><td class="r">'+(s.subtotal/t*100).toFixed(1)+'%</td></tr>'});
    gap+='<tr><td><b>시공 총액</b></td><td></td><td class="r"><b>'+won(t)+'</b></td><td class="r">100%</td></tr></table></div>';
    var spec='<div class="card"><h2>견적서 명세 · 공종별 세부</h2>';
    d.sections.forEach(function(s){
      spec+='<details><summary><span>'+esc(s.trade)+'</span><span>'+won(s.subtotal)+'</span></summary><table class="tbl"><tr><th>품목 · 규격</th><th class="r">수량</th><th class="r">단가</th><th class="r">금액</th></tr>';
      s.lines.forEach(function(l){spec+='<tr><td>'+esc(l.item)+(l.spec?'<span class="sp">'+esc(l.spec)+'</span>':'')+'</td><td class="r">'+num(l.qty)+' '+esc(l.unit)+'</td><td class="r">'+(l.price?l.price.toLocaleString('ko-KR'):'실측 후')+'</td><td class="r">'+(l.amount?l.amount.toLocaleString('ko-KR'):'-')+'</td></tr>'});
      spec+='</table></details>'});
    spec+='</div>';
    var sch='';
    if(d.schedule&&d.schedule.filter(function(p){return p.start}).length){
      var ss=d.schedule.filter(function(p){return p.start}).sort(function(a,b){return a.start<b.start?-1:1});d.schedule=ss;
      var f=(ss[0]||{}).start,l=ss.reduce(function(m,p){var e=p.end||p.start;return e>m?e:m},f||''),days=Math.round((new Date(l)-new Date(f))/864e5)+1;
      var pct=Math.max(0,Math.min(100,Math.round((new Date()-new Date(f))/(new Date(l)-new Date(f)+864e5)*100)));
      sch='<div class="card"><h2>시공 공정표 · 총 '+days+'일</h2><div class="meta">'+md(f)+' 시작 → '+md(l)+' 완공 예정</div><div class="bar"><i style="width:'+pct+'%"></i></div>';
      d.schedule.forEach(function(p){if(!p.start)return;var nm=String(p.phase||'').replace(/^Phase\s*\d+\s*[·\-:]\s*/i,'');var dd=p.days||(p.end?Math.round((new Date(p.end+'T00:00:00')-new Date(p.start+'T00:00:00'))/864e5)+1:1);sch+='<div class="ph"><div class="d">'+md(p.start)+(p.end&&p.start!==p.end?' ~ '+md(p.end):'')+'<br>'+dd+'일</div><div><b>'+esc(nm)+'</b><span>'+esc(p.trades)+'</span></div></div>'});
      sch+='<div class="meta" style="margin-top:10px">공정표는 현장 여건·자재 입고에 따라 조정될 수 있습니다.</div></div>';
      if(d.techs&&d.techs.length){sch+='<div class="card"><h2>담당 기술자·자재상</h2>';d.techs.forEach(function(x){sch+='<div class="kv"><span>'+esc(x.trade)+'</span><b>'+esc(x.name)+(x.phone?' · <a href="tel:'+esc(x.phone)+'">'+esc(x.phone)+'</a>':'')+'</b></div>'});sch+='</div>'}
      else{sch+='<div class="note">담당 기술자·자재상 연락처는 계약 후 이 화면에서 공정별로 안내해 드립니다.</div>'}
    }
    var info='';
    if(d.notes&&d.notes.length){info+='<div class="note"><b>확인해 주세요</b><ul>'+d.notes.map(function(n){return'<li>'+esc(n)+'</li>'}).join('')+'</ul></div>'}
    if(d.buy&&d.buy.length){info+='<div class="note"><b>고객님이 직접 고르시는 품목</b> (시공·설치비만 견적 포함)<ul>'+d.buy.map(function(n){return'<li>'+esc(n)+'</li>'}).join('')+'</ul></div>'}
    info+='<div class="card"><h2>결제 · 책임 구분</h2>'+
      (d.lump?'<div class="kv"><span>자재비·인건비</span><b>집지니가 대신 지급 (따로 결제하실 곳 없음)</b></div>':'<div class="kv"><span>자재비·인건비</span><b>자재상·기술자에게 직접 결제</b></div>')+
      '<div class="kv"><span>코디 운영비 (필수)</span><b>시공 전 선불 · 미진행 시 전액 환불</b></div>'+
      '<div class="kv"><span>현장관리비 (선택)</span><b>작업 전 전액 환불 · 진행분 차감</b></div>'+
      (d.lump?'<div class="kv"><span>시공 하자 책임</span><b>완공 후 12개월 집지니가 책임 보수</b></div>':'<div class="kv"><span>시공 하자 책임</span><b>시공한 기술자·자재상</b></div>')+
      '<div class="kv"><span>하자 조율</span><b>완공 후 12개월 집지니 코디 무상 지원</b></div>'+
      '<div class="kv"><span>운영비 결제·증빙</span><b>계좌 입금 또는 카드(스마트스토어) · 현금영수증·세금계산서 발행</b></div></div>';
    var h='<div class="brand">집지니 · 견적서</div><h1>'+esc(d.name)+' 고객님 견적서</h1>'+
      '<div class="meta">'+esc(d.site)+'<br>'+esc(d.spec)+(d.scope?'<br>공사 범위: '+esc(d.scope):'')+'<br>견적일 '+esc(d.date)+(d.quoteId?' · '+esc(d.quoteId):'')+(d.revision?' · '+esc(d.revision):'')+'</div>'+
      sum+'<div class="tabs"><div class="tab on" data-p="q">견적서</div>'+(sch?'<div class="tab" data-p="s">공정표</div>':'')+'<div class="tab" data-p="i">안내</div></div>'+
      '<div class="pane on" id="p-q">'+gap+spec+'</div>'+(sch?'<div class="pane" id="p-s">'+sch+'</div>':'')+'<div class="pane" id="p-i">'+info+'</div>'+
      '<div class="tools">'+(d.pdfUrl?'<a href="'+esc(d.pdfDownload||d.pdfUrl)+'" target="_blank" rel="noopener" onclick="return openPdf(this.href)">📄 PDF 저장 · 내려받기</a>':'')+'<button type="button" onclick="printQuote()">'+(d.pdfUrl?'인쇄':'인쇄 · PDF로 저장')+'</button></div>'+
      (inApp()?'<div class="tip">카카오톡 안에서 보고 계십니다 — 인쇄는 되지 않으니 「PDF 저장」을 누르시거나, 오른쪽 위 메뉴에서 「다른 브라우저로 열기」 뒤 인쇄해 주세요.</div>':'')+
      '<a class="cta" href="https://pf.kakao.com/_NjpxhC/chat">카톡으로 상담하기</a>'+
      '<div class="foot">집지니 · 박찬영 · 사업자번호 874-10-00088<br>인천 강화군 강화읍 동문로 33 · 카카오톡 @집지니<br>금액은 예상 견적이며 현장 실측 후 확정됩니다.</div>';
    CUR_PDF=d.pdfDownload||d.pdfUrl||'';
    app.innerHTML=h;document.title='집지니 · '+d.name+' 고객님 견적서';
    [].forEach.call(document.querySelectorAll('.tab'),function(b){b.onclick=function(){
      [].forEach.call(document.querySelectorAll('.tab'),function(x){x.classList.remove('on')});
      [].forEach.call(document.querySelectorAll('.pane'),function(x){x.classList.remove('on')});
      b.classList.add('on');document.getElementById('p-'+b.dataset.p).classList.add('on');window.scrollTo(0,0)}});
    if(keep&&keep!=='q'){var kb=document.querySelector('.tab[data-p="'+keep+'"]');if(kb)kb.onclick()}
  }
  var _opened=[];window.addEventListener('beforeprint',function(){_opened=[];[].forEach.call(document.querySelectorAll('details:not([open])'),function(x){x.open=true;_opened.push(x)})});
  window.addEventListener('afterprint',function(){_opened.forEach(function(x){x.open=false});_opened=[]});
  var staticP=getStatic().catch(function(){return null});
  var liveP=getLive();
  staticP.then(function(s){try{if(s&&!rendered)render(merge(s,null))}catch(e){}});
  Promise.all([staticP,liveP]).then(function(res){
    var s=res[0],l=res[1];
    if(!s&&!l)throw 0;
    if(l||!rendered)render(merge(s,l));
  }).catch(function(){if(!rendered)fail()});
})();
</script>
</body>
</html>
