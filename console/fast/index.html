<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>집지니 빠른 콘솔</title>
<meta name="theme-color" content="#0B6E4F">
<link rel="icon" href="/console/icons/icon-192.png">
<link rel="apple-touch-icon" href="/console/icons/apple-touch-icon.png">
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#0F172A;--sub:#64748B;--line:#E2E8F0;--brand:#0B6E4F;--brand-soft:#E7F3EE;--red:#C2410C;--red-soft:#FFF4ED;--amber:#B45309;--blue:#1D4ED8}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#111A2B;--ink:#E5E7EB;--sub:#94A3B8;--line:#1F2A3D;--brand:#34D399;--brand-soft:#0F2A22;--red:#FB923C;--red-soft:#2A1A10;--amber:#FBBF24;--blue:#93C5FD}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#111A2B;--ink:#E5E7EB;--sub:#94A3B8;--line:#1F2A3D;--brand:#34D399;--brand-soft:#0F2A22;--red:#FB923C;--red-soft:#2A1A10;--amber:#FBBF24;--blue:#93C5FD}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;font-size:14px;-webkit-text-size-adjust:100%}
.ico{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line);padding:calc(10px + env(safe-area-inset-top)) 16px 0}
.top{display:flex;align-items:center;gap:10px}
.logo{width:30px;height:30px;border-radius:8px;background:var(--brand);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700}
.top h1{font-size:15px;margin:0;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stamp-line{font-size:11px;color:var(--sub);margin-top:4px}
@media(max-width:560px){.btn .txt{display:none}.btn{padding:7px 9px}}
.stamp{font-size:11px;color:var(--sub);white-space:nowrap}
.btn{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:8px;padding:6px 10px;font-size:12.5px;cursor:pointer;display:inline-flex;align-items:center;gap:5px;text-decoration:none;font-family:inherit}
.btn:hover{border-color:var(--brand)}
.btn.pri{background:var(--brand);border-color:var(--brand);color:#fff}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:none}
nav::-webkit-scrollbar{display:none}
nav button{border:0;background:none;color:var(--sub);padding:9px 12px;font-size:13.5px;border-bottom:2px solid transparent;cursor:pointer;white-space:nowrap;font-family:inherit;display:flex;align-items:center;gap:5px}
nav button.on{color:var(--brand);border-bottom-color:var(--brand);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:14px 16px calc(40px + env(safe-area-inset-bottom))}
.sec{background:var(--card);border:1px solid var(--line);border-radius:12px;margin-bottom:14px;overflow:hidden}
.sec h2{font-size:13.5px;margin:0;padding:11px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px}
.sec h2 .r{margin-left:auto;font-weight:400;font-size:11.5px;color:var(--sub)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:8px;padding:12px}
.kpi{border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi .n{font-size:22px;font-weight:700}
.kpi .l{font-size:12.5px;margin-top:2px}
.kpi .s{font-size:11px;color:var(--sub);margin-top:2px}
.kpi.hot{border-color:var(--red);background:var(--red-soft)}
.kpi.zero{opacity:.55}
.strip{display:flex;flex-wrap:wrap;gap:6px 16px;padding:10px 14px;font-size:12.5px;color:var(--sub)}
.strip b{color:var(--ink)}
.row{display:flex;gap:10px;padding:10px 14px;border-top:1px solid var(--line);align-items:flex-start}
.row:first-child{border-top:0}
.row .m{flex:1;min-width:0}
.row .t{font-size:13.5px}
.row .s{font-size:11.5px;color:var(--sub);margin-top:2px}
.row .d{font-size:12px;white-space:nowrap}
.tag{display:inline-block;font-size:11px;padding:1px 7px;border-radius:9px;background:var(--brand-soft);color:var(--brand);white-space:nowrap}
.tag.red{background:var(--red-soft);color:var(--red)}
.tag.gray{background:var(--bg);color:var(--sub)}
.empty{padding:16px;color:var(--sub);font-size:12.5px}
.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
.tbl th,.tbl td{text-align:left;padding:8px 10px;border-top:1px solid var(--line);vertical-align:top}
.tbl th{color:var(--sub);font-weight:500;background:var(--bg)}
.tbl tr.click{cursor:pointer}.tbl tr.click:hover td{background:var(--brand-soft)}
.wrap{overflow-x:auto}
.search{display:flex;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.search input,.search select{flex:1;min-width:140px;border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:14px;background:var(--card);color:var(--ink);font-family:inherit}
.prog{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-top:4px}.prog i{display:block;height:100%;background:var(--brand)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);border-top:1px solid var(--line)}
.cal .h{font-size:11px;color:var(--sub);text-align:center;padding:6px 0;background:var(--bg)}
.cal .c{min-height:78px;border-top:1px solid var(--line);border-left:1px solid var(--line);padding:4px;font-size:11px;cursor:pointer;overflow:hidden}
.cal .c:nth-child(7n+1){border-left:0}
.cal .c.out{opacity:.4}.cal .c.today .dn{background:var(--brand);color:#fff;border-radius:50%}
.cal .dn{display:inline-flex;width:20px;height:20px;align-items:center;justify-content:center;font-weight:600}
.cal .ev{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border-radius:4px;padding:1px 4px;margin-top:2px;background:var(--brand-soft);color:var(--brand)}
.cal .ev.할일{background:var(--red-soft);color:var(--red)}.cal .ev.일정{background:#EEF2FF;color:var(--blue)}
.cal .sel{outline:2px solid var(--brand);outline-offset:-2px}
.login{max-width:380px;margin:60px auto;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:24px}
.login h2{margin:0 0 6px;font-size:17px}.login p{color:var(--sub);font-size:13px;line-height:1.6}
.login input{width:100%;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:15px;margin:8px 0;background:var(--card);color:var(--ink)}
.login .btn{width:100%;justify-content:center;padding:10px}
.detail{position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.detail.on{display:flex}
.detail .box{background:var(--card);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:14px 14px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){.detail{align-items:center}.detail .box{border-radius:14px}}
.kv{display:grid;grid-template-columns:110px 1fr;gap:6px 10px;font-size:13px}.kv .k{color:var(--sub)}
.note{font-size:11.5px;color:var(--sub);padding:0 14px 12px}
.spin{animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <symbol id="i-home" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/></symbol>
  <symbol id="i-check" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="m8 12 3 3 5-6"/></symbol>
  <symbol id="i-users" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2.5 20c.8-3.6 3.4-5.5 6.5-5.5s5.7 1.9 6.5 5.5"/><path d="M16 4.5a3.5 3.5 0 0 1 0 7"/><path d="M18 14.6c1.9.7 3.1 2.5 3.5 5.4"/></symbol>
  <symbol id="i-cal" viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></symbol>
  <symbol id="i-doc" viewBox="0 0 24 24"><path d="M14 3H6a1 1 0 0 0-1 1v16a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8z"/><path d="M14 3v5h5M9 13h6M9 17h6"/></symbol>
  <symbol id="i-refresh" viewBox="0 0 24 24"><path d="M20 11a8 8 0 1 0-2.3 5.7"/><path d="M20 4v7h-7"/></symbol>
  <symbol id="i-out" viewBox="0 0 24 24"><path d="M14 4h6v6M20 4l-9 9"/><path d="M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"/></symbol>
  <symbol id="i-send" viewBox="0 0 24 24"><path d="M21 3 10 14"/><path d="M21 3 14.5 21l-4.5-7-7-4.5z"/></symbol>
  <symbol id="i-site" viewBox="0 0 24 24"><path d="M3 21h18M5 21V9l7-5 7 5v12"/><path d="M9 21v-6h6v6"/></symbol>
  <symbol id="i-x" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6 6 18"/></symbol>
</svg>

<div id="loginView" style="display:none">
  <div class="login">
    <h2>집지니 빠른 콘솔</h2>
    <p>등록된 메일 주소를 넣으면 로그인 링크를 보내 드립니다. 메일의 링크를 누르면 이 화면으로 돌아와 바로 열립니다.</p>
    <input id="loginEmail" type="email" placeholder="메일 주소" autocomplete="email">
    <button class="btn pri" id="loginBtn">로그인 링크 받기</button>
    <p id="loginMsg"></p>
  </div>
</div>

<div id="setupView" style="display:none">
  <div class="login"><h2>설정이 아직 없습니다</h2><p>앱스 스크립트 스크립트 속성에 「슈퍼베이스_주소」와 「슈퍼베이스_공개열쇠」를 넣으면 열립니다.</p>
  <a class="btn pri" id="oldLink1"><svg class="ico"><use href="#i-out"/></svg>지금 콘솔 열기</a></div>
</div>

<div id="appView" style="display:none">
<header>
  <div class="top">
    <div class="logo">집</div>
    <h1>집지니 빠른 콘솔</h1>
    <button class="btn" id="refreshBtn" title="새로 계산 (1~2분)" aria-label="새로 계산"><svg class="ico" id="refreshIco"><use href="#i-refresh"/></svg><span class="txt">새로 계산</span></button>
    <a class="btn" id="oldLink" title="발송·저장은 전체 콘솔에서" aria-label="전체 콘솔"><svg class="ico"><use href="#i-out"/></svg><span class="txt">전체 콘솔</span></a>
  </div>
  <div class="stamp-line" id="stamp"></div>
  <nav id="tabs">
    <button data-t="home" class="on"><svg class="ico"><use href="#i-home"/></svg>홈</button>
    <button data-t="todo"><svg class="ico"><use href="#i-check"/></svg>할 일</button>
    <button data-t="cust"><svg class="ico"><use href="#i-users"/></svg>고객</button>
    <button data-t="cal"><svg class="ico"><use href="#i-cal"/></svg>달력</button>
    <button data-t="quote"><svg class="ico"><use href="#i-doc"/></svg>견적</button>
  </nav>
</header>
<main>
  <div id="p-home"></div>
  <div id="p-todo" style="display:none"></div>
  <div id="p-cust" style="display:none"></div>
  <div id="p-cal" style="display:none"></div>
  <div id="p-quote" style="display:none"></div>
</main>
</div>

<div class="detail" id="detail"><div class="box" id="detailBox"></div></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
// 2026-10-20 슈퍼베이스 영어 오류 → 한국어
function koErr(m) { m = String(m || ''); var w = m.match(/after (\d+) seconds?/i);
  if (w) return '이미 링크를 보냈습니다 — 메일함을 먼저 확인하세요. 다시 받으려면 ' + w[1] + '초 뒤에 누르세요.';
  if (/rate limit/i.test(m)) return '잠시 뒤에 다시 해 주세요 (짧은 시간에 너무 많이 요청함).';
  if (/expired|invalid.*(token|link)|otp/i.test(m)) return '링크가 만료됐거나 이미 썼습니다 — 새 링크를 받아 주세요.';
  if (/not allowed|signups? not allowed|not found/i.test(m)) return '등록되지 않은 메일입니다 — 대표에게 등록을 요청하세요.';
  if (/network|fetch/i.test(m)) return '인터넷 연결을 확인해 주세요.';
  if (/JWT|permission|policy/i.test(m)) return '권한이 없습니다 — 다시 로그인해 주세요.';
  return '문제가 생겼습니다 (' + m.slice(0, 80) + ')'; }

(function () {
  var GAS = 'https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec';
  var T0 = performance.now();
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var won = function (n) { n = Number(n) || 0; return n.toLocaleString('ko-KR') + '원'; };
  var ls = { get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} } };
  $('oldLink').href = '/console/app/'; $('oldLink1').href = '/console/app/';   // 2026-10-20 전체 콘솔도 jipjini.com 에서 바로
  try { if (/[?&]next=app\b/.test(location.search)) localStorage.setItem('jjf_next', 'app'); } catch (_n) {}
  function goNext() { try { if (localStorage.getItem('jjf_next') === 'app') { localStorage.removeItem('jjf_next'); location.replace('/console/app/'); return true; } } catch (_n) {} return false; }

  var V = {}, META = null, sb = null, ORG = 'jipjini', curTab = 'home', calYm = null, calSel = null;

  function show(which) { ['loginView', 'setupView', 'appView'].forEach(function (id) { $(id).style.display = id === which ? '' : 'none'; }); }

  // ── 설정: 한 번 받아 브라우저에 둔다 (앱스 스크립트는 처음 한 번만 부름)
  function getConfig() {
    var c = ls.get('jjf_conf');
    if (c && c.url && c.anon) { refreshConfigLater(); return Promise.resolve(c); }
    return fetch(GAS + '?type=sb_config').then(function (r) { return r.json(); }).then(function (j) {
      if (j && j.url && j.anon) { ls.set('jjf_conf', { url: j.url, anon: j.anon, org: j.org }); return j; }
      return null;
    });
  }
  function refreshConfigLater() { setTimeout(function () { fetch(GAS + '?type=sb_config').then(function (r) { return r.json(); }).then(function (j) { if (j && j.url && j.anon) ls.set('jjf_conf', { url: j.url, anon: j.anon, org: j.org }); }).catch(function () {}); }, 8000); }

  // ── 시작
  var cached = ls.get('jjf_views');
  if (cached && cached.V) { V = cached.V; META = cached.META; show('appView'); renderAll(true); }
  getConfig().then(function (c) {
    if (!c) { if (!cached) show('setupView'); return; }
    ORG = c.org || 'jipjini';
    sb = window.supabase.createClient(c.url, c.anon, { auth: { persistSession: true, detectSessionInUrl: true } });
    sb.auth.getSession().then(function (s) {
      if (!s.data.session) { show('loginView'); return; }
      if (goNext()) return;
      show('appView'); loadViews();
    });
    sb.auth.onAuthStateChange(function (ev, session) { if (ev === 'SIGNED_IN' && session) { if (goNext()) return; show('appView'); loadViews(); } });
  }).catch(function (e) { if (!cached) { show('setupView'); } });

  $('loginBtn').onclick = function () {
    var em = $('loginEmail').value.trim(); if (!em || !sb) return;
    $('loginMsg').textContent = '보내는 중…';
    sb.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + location.pathname, shouldCreateUser: true } }).then(function (r) {
      $('loginMsg').textContent = r.error ? koErr(r.error.message) : '메일을 확인해 주세요. 링크를 누르면 바로 열립니다.';
    });
  };

  // ── 자료 읽기 (슈퍼베이스에서 바로)
  function loadViews() {
    var t = performance.now();
    return sb.from('console_views').select('key,data,updated_at').eq('org_id', ORG).then(function (r) {
      if (r.error) { $('stamp').textContent = '읽기 실패: ' + koErr(r.error.message); return; }
      if (!r.data || !r.data.length) { $('stamp').textContent = '등록되지 않은 계정이거나 자료가 아직 없습니다'; return; }
      var nv = {}; r.data.forEach(function (row) { nv[row.key] = row.data; if (row.key === 'meta') META = Object.assign({}, row.data, { at: row.updated_at }); });
      V = nv; V._ms = Math.round(performance.now() - t); V._total = Math.round(performance.now() - T0);
      ls.set('jjf_views', { V: V, META: META });
      renderAll(false);
    });
  }
  setInterval(function () { if (sb && document.visibilityState === 'visible') loadViews(); }, 60000);
  document.addEventListener('visibilitychange', function () { if (sb && document.visibilityState === 'visible') loadViews(); });

  function ago(iso) { if (!iso) return ''; var m = Math.round((Date.now() - new Date(iso).getTime()) / 60000); return m <= 0 ? '방금' : (m < 60 ? m + '분 전' : Math.round(m / 60) + '시간 전'); }
  function stampText(fromCache) {
    var s = META ? '자료 ' + ago(META.at) + ' 기준' : '';
    if (fromCache) return s + ' · 지난 화면';
    if (V._ms != null) s += ' · 읽기 ' + (V._ms / 1000).toFixed(2) + '초';
    return s;
  }

  // ── 새로 계산 요청
  $('refreshBtn').onclick = function () {
    if (!sb) return; var before = META && META.at;
    $('refreshIco').classList.add('spin'); $('stamp').textContent = '앱스 스크립트가 새로 계산 중… (1~2분)';
    sb.auth.getUser().then(function (u) {
      return sb.from('console_refresh').insert({ org_id: ORG, asked_by: (u.data.user && u.data.user.email) || '' });
    }).then(function (r) {
      if (r && r.error) { $('refreshIco').classList.remove('spin'); $('stamp').textContent = '요청 실패: ' + koErr(r.error.message); return; }
      var n = 0, iv = setInterval(function () {
        n++; loadViews().then(function () {
          if ((META && META.at !== before) || n > 24) { clearInterval(iv); $('refreshIco').classList.remove('spin'); }
        });
      }, 10000);
    });
  };

  // ── 탭
  Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (b) {
    b.onclick = function () {
      curTab = b.getAttribute('data-t');
      Array.prototype.forEach.call(document.querySelectorAll('#tabs button'), function (x) { x.classList.toggle('on', x === b); });
      ['home', 'todo', 'cust', 'cal', 'quote'].forEach(function (k) { $('p-' + k).style.display = k === curTab ? '' : 'none'; });
      window.scrollTo(0, 0);
    };
  });

  function renderAll(fromCache) {
    $('stamp').textContent = stampText(fromCache);
    try { renderHome(); } catch (e) { $('p-home').innerHTML = '<div class="empty">홈 표시 오류: ' + esc(e.message) + '</div>'; }
    try { renderTodo(); } catch (e) {}
    try { renderCust(); } catch (e) {}
    try { renderCal(); } catch (e) {}
    try { renderQuotes(); } catch (e) {}
  }

  function sec(title, icon, right, body) { return '<div class="sec"><h2><svg class="ico"><use href="#i-' + icon + '"/></svg>' + title + (right ? '<span class="r">' + right + '</span>' : '') + '</h2>' + body + '</div>'; }
  function dTxt(D) { if (D == null) return ''; if (D < 0) return '<span style="color:var(--red);font-weight:600">' + (-D) + '일 지남</span>'; if (D === 0) return '<b>오늘</b>'; return 'D-' + D; }
  function todoRow(t) {
    var g = t.급 || ''; var cls = /긴급/.test(g) ? 'red' : (/오늘/.test(g) ? '' : 'gray');

  }

  function renderHome() {
    var d = V.home || {}, r = d.오늘 || {}, h = '';
    if (d.파이프) h += sec('진행 단계', 'home', '', '<div class="grid">' + d.파이프.map(function (p) { return '<div class="kpi' + (p.n > 0 && /AS|알림|의뢰/.test(p.key) ? ' hot' : (p.n ? '' : ' zero')) + '"><div class="n">' + p.n + '</div><div class="l">' + esc(p.label) + '</div><div class="s">' + esc(p.sub) + '</div></div>'; }).join('') + '</div>');
    var k = function (l, n, s, hot) { return '<div class="kpi' + (n ? (hot ? ' hot' : '') : ' zero') + '"><div class="n">' + (n || 0) + '</div><div class="l">' + l + '</div><div class="s">' + s + '</div></div>'; };
    var pay = d.입금 || {}, kk = d.카톡 || {};
    h += sec('오늘', 'check', esc(r.today || ''), '<div class="grid">' +
      k('카톡 미응답', kk.미응답, kk.마지막수신 ? '마지막 ' + esc(kk.마지막수신) : '', true) +
      k('알림 승인 대기', d.알림대기, '검토 후 발송', true) +
      k('신규 의뢰', (r.newRequests || {}).count, '오늘 접수', true) +
      k('견적 확정 대기', (r.pendingQuotes || {}).count, '초안 → 확정') +
      k('계약 대기', (r.pendingContracts || {}).count, '견적 확정 후') +
      k('입금 대기', pay.대기, '잔액 ' + won(pay.잔액), true) +
      k('오늘 공정', (r.todayPhases || {}).count, '시작·종료 예정') +
      k('발주 임박', d.발주임박, '3일 안', true) +
      k('하자 미처리', d.AS미처리, '접수~일정 확정', true) + '</div>');
    if (d.이달) { var m = d.이달; h += '<div class="sec"><div class="strip"><span>이달</span><span>의뢰 <b>' + m.의뢰 + '</b></span><span>견적 <b>' + m.견적 + '</b></span><span>계약 <b>' + m.계약 + '</b></span><span>완공 <b>' + m.완공 + '</b></span><span>코디비 입금 <b>' + won(m.코디비입금) + '</b></span>' + (m.전환율 != null ? '<span>견적→계약 90일 <b>' + m.전환율 + '%</b></span>' : '') + '</div></div>'; }
    var td = d.할일 || { 목록: [], 요약: {} };
    h += sec('할 일 상위', 'check', '긴급 ' + (td.요약.긴급 || 0) + ' · 오늘 ' + (td.요약.오늘 || 0) + ' · 이번주 ' + (td.요약.이번주 || 0), (td.목록 || []).length ? td.목록.map(todoRow).join('') : '<div class="empty">지금 할 일 없음</div>');
    var sd = d.오늘발송 || { 목록: [] }, chip = function (on, l) { return '<span class="tag ' + (on ? '' : 'gray') + '" style="' + (on ? '' : 'text-decoration:line-through') + '">' + l + '</span> '; };
    h += sec('오늘 발송한 견적', 'send', (sd.목록 || []).length + '건' + (sd.휴대폰안감 ? ' · 휴대폰 미발송 ' + sd.휴대폰안감 : ''), (sd.목록 || []).length ? '<div class="wrap"><table class="tbl"><tr><th>시각</th><th>고객</th><th>나간 길</th></tr>' + sd.목록.map(function (o) { return '<tr' + (o.휴대폰안감 ? ' style="background:var(--red-soft)"' : '') + '><td>' + esc(o.시각) + '</td><td><b>' + esc(o.고객명 || '-') + '</b><div class="s" style="font-size:11px;color:var(--sub)">' + esc(o.견적서ID || '') + '</div></td><td>' + chip(o.알림톡, '알림톡') + chip(o.문자, '문자') + chip(o.이메일, '이메일') + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">오늘 나간 견적 없음</div>');
    var sites = d.현장 || [];
    h += sec('시공 중 · 착공 준비', 'site', sites.length + '곳', sites.length ? sites.map(function (s) { return '<div class="row"><div class="m"><div class="t"><b>' + esc(s.고객명) + '</b> <span class="tag">' + esc(s.단계 === '계약' ? '착공 준비' : s.단계) + '</span></div><div class="s">' + esc(s.주소 || '') + '</div><div class="s">현재 ' + esc(s.현재공정 || '-') + ' · 다음 ' + esc(s.다음공정 ? s.다음공정 + ' ' + (s.다음공정일 || '') : '-') + (s.발주임박 && s.발주임박.length ? ' · <span style="color:var(--red)">발주 ' + esc(s.발주임박.join(', ')) + '</span>' : '') + '</div><div class="prog"><i style="width:' + (s.진행 || 0) + '%"></i></div></div><div class="d">' + (s.진행 || 0) + '%</div></div>'; }).join('') : '<div class="empty">시공 중·착공 예정 현장 없음</div>');
    if (META && META.부분ms) h += '<div class="note">앱스 스크립트 계산 ' + ((META.계산ms || 0) / 1000).toFixed(1) + '초 (' + esc(META.이유 || '') + ') · 화면 읽기 ' + (V._ms != null ? (V._ms / 1000).toFixed(2) + '초' : '-') + ' · 첫 화면까지 ' + (V._total != null ? (V._total / 1000).toFixed(2) + '초' : '-') + '</div>';
    $('p-home').innerHTML = h;
  }

  var todoKind = '';
  function renderTodo() {
    var td = V.todo || { 목록: [] }, all = td.목록 || [];
    var kinds = {}; all.forEach(function (t) { kinds[t.급 || '기타'] = (kinds[t.급 || '기타'] || 0) + 1; });
    var list = todoKind ? all.filter(function (t) { return (t.급 || '기타') === todoKind; }) : all;
    $('p-todo').innerHTML = sec('할 일 전체', 'check', all.length + '건', '<div class="search"><select id="todoKind"><option value="">전체</option>' + Object.keys(kinds).map(function (k) { return '<option' + (k === todoKind ? ' selected' : '') + '>' + esc(k) + '</option>'; }).join('') + '</select></div>' + (list.length ? list.map(todoRow).join('') : '<div class="empty">없음</div>'));
    $('todoKind').onchange = function () { todoKind = this.value; renderTodo(); };
  }

  var custQ = '', custStage = '';
  function renderCust() {
    var L = Array.isArray(V.ledger) ? V.ledger : [], q = custQ.toLowerCase();
    var stages = {}; L.forEach(function (c) { stages[c['단계'] || '-'] = 1; });
    var list = L.filter(function (c) { if (custStage && (c['단계'] || '-') !== custStage) return false; if (!q) return true; return [c['고객명'], c['연락처'], c['주소'], c['최근 의뢰ID'], c['최근 견적서ID']].join(' ').toLowerCase().indexOf(q) >= 0; });
    var body = '<div class="search"><input id="custQ" placeholder="이름·번호·주소 찾기" value="' + esc(custQ) + '"><select id="custStage"><option value="">모든 단계</option>' + Object.keys(stages).map(function (s) { return '<option' + (s === custStage ? ' selected' : '') + '>' + esc(s) + '</option>'; }).join('') + '</select></div>';
    body += list.length ? '<div class="wrap"><table class="tbl"><tr><th>고객</th><th>단계</th><th>견적</th><th>현재 공정</th></tr>' + list.map(function (c, i) { return '<tr class="click" data-i="' + L.indexOf(c) + '"><td><b>' + esc(c['고객명'] || '-') + '</b><div style="font-size:11px;color:var(--sub)">' + esc(c['연락처'] || '') + '</div></td><td><span class="tag">' + esc(c['단계'] || '-') + '</span></td><td>' + (c['견적합계'] ? won(c['견적합계']) : '-') + '</td><td>' + esc(c['현재 공정'] || '-') + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">없음</div>';
    $('p-cust').innerHTML = sec('고객 대장', 'users', list.length + '명', body);
    var qi = $('custQ'); qi.oninput = function () { custQ = this.value; var pos = this.selectionStart; renderCust(); var n = $('custQ'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
    $('custStage').onchange = function () { custStage = this.value; renderCust(); };
    Array.prototype.forEach.call(document.querySelectorAll('#p-cust tr.click'), function (tr) { tr.onclick = function () { openCust(L[Number(tr.getAttribute('data-i'))]); }; });
  }
  var CL_KEYS = ['고객명', '연락처', '주소', '단계', '최근 의뢰ID', '접수일', '의뢰상태', '최근 견적서ID', '견적상태', '견적합계', '견적일', '계약ID', '계약상태', '계약일', '공정표ID', '시공시작일', '완공예정일', '현재 공정', '다음 공정', '다음 공정일', '마지막 알림', '마지막 알림 시각', '의뢰 수', '비고'];
  function openCust(c) {
    if (!c) return;
    var h = '<div style="display:flex;align-items:center;margin-bottom:10px"><b style="font-size:16px;flex:1">' + esc(c['고객명'] || '-') + '</b><button class="btn" id="dClose"><svg class="ico"><use href="#i-x"/></svg>닫기</button></div><div class="kv">';
    CL_KEYS.forEach(function (k) { var v = c[k]; if (v == null || v === '') return; if (k === '견적합계') v = won(v); h += '<div class="k">' + esc(k) + '</div><div>' + esc(v) + '</div>'; });
    h += '</div>';
    var ph = c['공정목록'] || []; if (ph.length) h += '<div style="margin-top:14px;font-weight:600">공정</div><table class="tbl">' + ph.map(function (p) { return '<tr><td>' + esc(p.label || p.단계명 || '') + '</td><td>' + esc((p.start || '') + (p.end ? ' ~ ' + p.end : '')) + '</td><td>' + esc(p.status || '') + '</td></tr>'; }).join('') + '</table>';
    h += '<div style="margin-top:14px"><a class="btn pri" href="' + GAS + '" target="_blank" rel="noopener"><svg class="ico"><use href="#i-out"/></svg>전체 콘솔에서 처리</a></div>';
    $('detailBox').innerHTML = h; $('detail').classList.add('on'); $('dClose').onclick = closeDetail;
  }
  function closeDetail() { $('detail').classList.remove('on'); }
  $('detail').onclick = function (e) { if (e.target === this) closeDetail(); };

  function renderCal() {
    var months = Object.keys(V).filter(function (k) { return /^cal:/.test(k); }).map(function (k) { return k.slice(4); }).sort();
    if (!months.length) { $('p-cal').innerHTML = '<div class="empty">달력 자료 없음</div>'; return; }
    if (!calYm || months.indexOf(calYm) < 0) calYm = months[0];
    var cd = V['cal:' + calYm] || {}, evs = cd.일정 || [], today = cd.오늘 || '';
    var y = Number(calYm.slice(0, 4)), mo = Number(calYm.slice(5, 7)) - 1, first = new Date(y, mo, 1), start = new Date(y, mo, 1 - first.getDay());
    var ymd = function (dt) { return dt.getFullYear() + '-' + String(dt.getMonth() + 1).padStart(2, '0') + '-' + String(dt.getDate()).padStart(2, '0'); };
    var byDay = {}; evs.forEach(function (e) { var s = e.날짜, en = e.끝 || e.날짜; if (!s) return; var dt = new Date(s + 'T00:00:00'), end = new Date(en + 'T00:00:00'), n = 0; while (dt <= end && n < 60) { var k = ymd(dt); (byDay[k] = byDay[k] || []).push(e); dt.setDate(dt.getDate() + 1); n++; } });
    var g = '<div class="cal">' + ['일', '월', '화', '수', '목', '금', '토'].map(function (w) { return '<div class="h">' + w + '</div>'; }).join('');
    for (var i = 0; i < 42; i++) { var dt = new Date(start); dt.setDate(start.getDate() + i); var k = ymd(dt), list = byDay[k] || [];
      g += '<div class="c' + (dt.getMonth() !== mo ? ' out' : '') + (k === today ? ' today' : '') + (k === calSel ? ' sel' : '') + '" data-d="' + k + '"><span class="dn">' + dt.getDate() + '</span>' + list.slice(0, 3).map(function (e) { return '<div class="ev ' + esc(e.종류 || '') + '">' + esc((e.시각 ? e.시각 + ' ' : '') + e.제목) + '</div>'; }).join('') + (list.length > 3 ? '<div style="color:var(--sub)">+' + (list.length - 3) + '</div>' : '') + '</div>'; }
    g += '</div>';
    var nav = months.map(function (m) { return '<button class="btn' + (m === calYm ? ' pri' : '') + '" data-m="' + m + '">' + Number(m.slice(5)) + '월</button>'; }).join(' ');
    var sel = calSel || today, sl = byDay[sel] || [];
    var day = '<div style="padding:10px 14px;font-weight:600;border-top:1px solid var(--line)">' + esc(sel) + ' 일정 ' + sl.length + '건</div>' + (sl.length ? sl.map(function (e) { return '<div class="row"><div><span class="tag ' + (e.종류 === '할일' ? 'red' : (e.종류 === '일정' ? 'gray' : '')) + '">' + esc(e.종류 || '') + '</span></div><div class="m"><div class="t">' + esc((e.시각 ? e.시각 + ' ' : '') + e.제목) + '</div><div class="s">' + esc(e.메모 || '') + '</div></div></div>'; }).join('') : '<div class="empty">일정 없음</div>');
    $('p-cal').innerHTML = sec('달력', 'cal', nav, g + day + '<div class="note">일정 넣기·지우기는 전체 콘솔 달력 탭에서 합니다. 휴대폰 구글 캘린더 「집지니 일정」에도 반영됩니다.</div>');
    Array.prototype.forEach.call(document.querySelectorAll('#p-cal [data-m]'), function (b) { b.onclick = function () { calYm = b.getAttribute('data-m'); calSel = null; renderCal(); }; });
    Array.prototype.forEach.call(document.querySelectorAll('#p-cal .c'), function (c) { c.onclick = function () { calSel = c.getAttribute('data-d'); renderCal(); }; });
  }

  var qQ = '';
  function renderQuotes() {
    var Q = Array.isArray(V.quotes) ? V.quotes.slice() : [], q = qQ.toLowerCase();
    Q.sort(function (a, b) { return String(b['견적서ID'] || '').localeCompare(String(a['견적서ID'] || '')); });
    var list = Q.filter(function (x) { return !q || [x['견적서ID'], x['고객명'], x['의뢰ID'], x['상태']].join(' ').toLowerCase().indexOf(q) >= 0; });
    var dateKey = function (x) { return x['작성일'] || x['견적일'] || x['생성일'] || ''; };
    var body = '<div class="search"><input id="qQ" placeholder="견적번호·이름·상태 찾기" value="' + esc(qQ) + '"></div>' + (list.length ? '<div class="wrap"><table class="tbl"><tr><th>견적</th><th>고객</th><th>상태</th><th>시공</th></tr>' + list.map(function (x) { return '<tr><td>' + esc(x['견적서ID']) + '<div style="font-size:11px;color:var(--sub)">' + esc(String(dateKey(x)).slice(0, 10)) + '</div></td><td><b>' + esc(x['고객명'] || '-') + '</b></td><td><span class="tag ' + (/중복|취소/.test(x['상태'] || '') ? 'gray' : '') + '">' + esc(x['상태'] || '-') + '</span></td><td>' + (x['시공총액'] ? won(x['시공총액']) : '-') + '</td></tr>'; }).join('') + '</table></div>' : '<div class="empty">없음</div>');
    $('p-quote').innerHTML = sec('견적', 'doc', list.length + '건', body + '<div class="note">금액은 부가세 10% 별도입니다. 견적 고치기·발송은 전체 콘솔에서 합니다.</div>');
    var qi = $('qQ'); qi.oninput = function () { qQ = this.value; var pos = this.selectionStart; renderQuotes(); var n = $('qQ'); n.focus(); try { n.setSelectionRange(pos, pos); } catch (e) {} };
  }
})();
