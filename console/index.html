<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>집지니 코디 콘솔</title>
<meta name="theme-color" content="#0B6E4F">
<link rel="icon" href="/console/icons/icon-192.png">
<link rel="apple-touch-icon" href="/console/icons/apple-touch-icon.png">
<link rel="manifest" href="/console/manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="집지니 콘솔">
<style>
:root{--bg:#F4F6F8;--card:#fff;--ink:#0F172A;--sub:#64748B;--line:#E2E8F0;--brand:#0B6E4F}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0B1220;--card:#111A2B;--ink:#E5E7EB;--sub:#94A3B8;--line:#1F2A3D;--brand:#34D399}}
:root[data-theme="dark"]{--bg:#0B1220;--card:#111A2B;--ink:#E5E7EB;--sub:#94A3B8;--line:#1F2A3D;--brand:#34D399}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif}
.box{max-width:420px;margin:18vh 16px 0;padding:24px 22px;background:var(--card);border:1px solid var(--line);border-radius:14px}
.box h1{font-size:17px;margin:0 0 8px}.box p{font-size:13px;color:var(--sub);line-height:1.7;margin:0 0 12px}
.bar{height:4px;background:var(--line);border-radius:4px;overflow:hidden}.bar i{display:block;height:100%;width:30%;background:var(--brand);animation:mv 1.1s ease-in-out infinite}
@keyframes mv{0%{margin-left:-30%}100%{margin-left:100%}}
a.btn{display:inline-block;margin-top:6px;padding:10px 14px;border-radius:10px;background:var(--brand);color:#fff;text-decoration:none;font-size:13px;font-weight:600}
a.sub{display:inline-block;margin:10px 0 0 10px;font-size:12.5px;color:var(--sub)}
.f{display:block;margin:0 0 8px}.f input{width:100%;box-sizing:border-box;padding:11px 12px;border:1px solid var(--line);border-radius:10px;font-size:15px;background:var(--card);color:var(--ink)}
button.btn{display:block;width:100%;padding:11px 14px;border:0;border-radius:10px;background:var(--brand);color:#fff;font-size:14px;font-weight:600;cursor:pointer;margin-top:4px}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line);margin-top:8px;font-weight:500}
.err{color:#C2410C;font-size:12.5px;min-height:18px;margin-top:6px}
@media (min-width:452px){.box{margin:18vh auto 0}}
</style>
</head>
<body>
<div class="box" id="box"><h1>집지니 코디 콘솔</h1><p id="msg">여는 중…</p><div class="bar" id="bar"><i></i></div></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.117.2/dist/umd/supabase.js"></script>
<script>
// 2026-10-20 전체 콘솔을 jipjini.com 에서 바로 띄운다 — 구글 웹앱 띄우기(3~7초)를 건너뛴다.
//   ① 슈퍼베이스 로그인(빠른 콘솔과 같은 로그인) ② 화면 코드(console_views 「app」 줄, 로그인한 사람만 읽힘)와 미리 계산한 화면을 한꺼번에 받고
//   ③ google.script.run 을 「구글 서버 rpc 창구」로 바꿔 끼운 뒤 화면을 그린다. 화면 코드는 이 기기에 두었다가 바뀐 때만 새로 받는다.
(function () {
  var GAS = 'https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec';
  var $ = function (id) { return document.getElementById(id); };
  var ls = { get: function (k) { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } }, set: function (k, v) { try { localStorage.setItem(k, JSON.stringify(v)); return true; } catch (e) { return false; } } };
  function say(t, link) { $('msg').innerHTML = t; $('bar').style.display = link ? 'none' : ''; }
  // 2026-10-20 예전처럼 이 주소에서 바로 로그인 — 메일 + 비밀번호(대표님이 정한 것). 비밀번호가 아직 없으면 메일 링크로 한 번 들어와 정한다
  var SB = null;
  function needLogin(sb) {
    SB = sb || SB; $('bar').style.display = 'none';
    $('msg').innerHTML = '<label class="f"><input id="lgEmail" type="email" autocomplete="username" placeholder="메일 주소" value="' + (ls.get('jja_email') || '') + '"></label>' +
      '<label class="f"><input id="lgPw" type="password" autocomplete="current-password" placeholder="비밀번호"></label>' +
      '<button class="btn" id="lgBtn">로그인</button><div class="err" id="lgErr"></div>' +
      '<button class="btn ghost" id="lgMail">비밀번호가 없으면 — 메일로 로그인 링크 받기</button>' +
      '<a class="sub" href="/console/google/">예전 구글 콘솔</a>';
    var go = function () {
      var em = $('lgEmail').value.trim(), pw = $('lgPw').value; if (!em || !pw) { $('lgErr').textContent = '메일과 비밀번호를 적어 주세요.'; return; }
      $('lgBtn').disabled = true; $('lgErr').textContent = '';
      SB.auth.signInWithPassword({ email: em, password: pw }).then(function (r) { $('lgBtn').disabled = false; if (r.error) { $('lgErr').textContent = /Invalid login/i.test(r.error.message) ? '메일 또는 비밀번호가 맞지 않습니다. 비밀번호를 정한 적이 없으면 아래 「메일로 로그인 링크 받기」.' : r.error.message; return; } ls.set('jja_email', em); location.reload(); });
    };
    $('lgBtn').onclick = go; $('lgPw').onkeydown = function (e) { if (e.key === 'Enter') go(); };
    $('lgMail').onclick = function () {
      var em = $('lgEmail').value.trim(); if (!em) { $('lgErr').textContent = '메일 주소를 적어 주세요.'; return; }
      try { localStorage.setItem('jjf_next', 'console'); localStorage.setItem('jja_needpw', '1'); } catch (_n) {}
      SB.auth.signInWithOtp({ email: em, options: { emailRedirectTo: location.origin + '/console/fast/', shouldCreateUser: false } }).then(function (r) {
        $('lgErr').textContent = r.error ? (/after (\d+) seconds/.test(r.error.message) ? '이미 보냈습니다 — 메일함을 확인하세요.' : r.error.message) : '메일을 보냈습니다. 링크를 누르면 이 화면으로 돌아와 비밀번호를 정합니다.';
        ls.set('jja_email', em);
      });
    };
    setTimeout(function () { var el = $(ls.get('jja_email') ? 'lgPw' : 'lgEmail'); if (el) el.focus(); }, 50);
  }
  // 메일 링크로 처음 들어온 뒤: 다음부터 비밀번호로 들어오게 한 번 정한다
  function askPassword(sb, next) {
    $('bar').style.display = 'none';
    $('msg').innerHTML = '다음부터 이 주소에서 <b>메일 + 비밀번호</b>로 바로 들어오도록 비밀번호를 정해 주세요 (8자 이상).<br><br>' +
      '<label class="f"><input id="npw1" type="password" autocomplete="new-password" placeholder="새 비밀번호"></label><label class="f"><input id="npw2" type="password" autocomplete="new-password" placeholder="한 번 더"></label>' +
      '<button class="btn" id="npwBtn">비밀번호 정하기</button><div class="err" id="npwErr"></div><button class="btn ghost" id="npwSkip">나중에</button>';
    $('npwSkip').onclick = function () { try { localStorage.removeItem('jja_needpw'); } catch (_s) {} next(); };
    $('npwBtn').onclick = function () {
      var a = $('npw1').value, b = $('npw2').value; if (a.length < 8) { $('npwErr').textContent = '8자 이상으로 정해 주세요.'; return; } if (a !== b) { $('npwErr').textContent = '두 번 적은 비밀번호가 다릅니다.'; return; }
      $('npwBtn').disabled = true;
      sb.auth.updateUser({ password: a }).then(function (r) { $('npwBtn').disabled = false; if (r.error) { $('npwErr').textContent = r.error.message; return; } try { localStorage.removeItem('jja_needpw'); } catch (_s) {} next(); });
    };
  }
  function fail(e) { say('열지 못했습니다 — ' + String(e && e.message || e).slice(0, 120) + '<br><a class="btn" href="javascript:location.reload()">다시 시도</a><a class="sub" href="/console/google/">예전 구글 콘솔</a>', true); }

  function getConfig() {
    var c = ls.get('jjf_conf'); if (c && c.url && c.anon) return Promise.resolve(c);
    return fetch(GAS + '?type=sb_config').then(function (r) { return r.json(); }).then(function (j) { if (j && j.url && j.anon) { ls.set('jjf_conf', { url: j.url, anon: j.anon, org: j.org }); return j; } throw new Error('설정 없음'); });
  }

  getConfig().then(function (c) {
    var sb = window.supabase.createClient(c.url, c.anon, { auth: { persistSession: true, autoRefreshToken: true } }), ORG = c.org || 'jipjini';
    return sb.auth.getSession().then(function (s) {
      var ses = s.data.session; if (!ses) { needLogin(sb); return; }
      try { if (localStorage.getItem('jja_needpw') === '1') { return new Promise(function (res) { askPassword(sb, res); }).then(function () { location.reload(); }); } } catch (_p) {}
      var cached = ls.get('jja_app');   // { ver, html }
      var verP = sb.from('console_views').select('data').eq('org_id', ORG).eq('key', 'app_ver').maybeSingle();
      var snapP = sb.from('console_views').select('key,data,updated_at').eq('org_id', ORG).in('key', ['home', 'todo', 'ledger', 'boot']);
      return verP.then(function (v) {
        if (v.error) throw v.error;
        var ver = v.data && v.data.data && v.data.data.ver;
        if (!ver) throw new Error('화면이 아직 올라오지 않았습니다 (몇 분 뒤 다시)');
        if (cached && cached.ver === ver && cached.html) return cached.html;
        say('새 화면 받는 중…');
        return sb.from('console_views').select('data').eq('org_id', ORG).eq('key', 'app').maybeSingle().then(function (a) {
          if (a.error) throw a.error; var html = a.data && a.data.data && a.data.data.html; if (!html) throw new Error('화면 자료가 비어 있습니다');
          ls.set('jja_app', { ver: ver, html: html }); return html;
        });
      }).then(function (html) {
        return snapP.then(function (sn) {
          var snap = {}; ((sn && sn.data) || []).forEach(function (r) { snap[r.key] = { t: Date.parse(r.updated_at) || Date.now(), d: r.data }; });
          try { sb.auth.stopAutoRefresh && sb.auth.stopAutoRefresh(); } catch (_ar) {}   // 2026-10-21 점검: 로그인 갱신은 화면 안 연결부 한 곳에서만 (같은 갱신 열쇠를 두 번 쓰면 로그아웃될 수 있음)
          start(html, snap, c);
        });
      });
    });
  }).catch(fail);

  // google.script.run 대신 — 구글 서버 rpc 창구로 보낸다 (로그인 토큰은 매번 이 기기 저장소에서 꺼내고, 만료가 가까우면 새로 받는다)
  function shim(cfg) {
    var KEY = 'sb-' + cfg.url.replace(/^https:\/\//, '').split('.')[0] + '-auth-token';
    function sesGet() { try { return JSON.parse(localStorage.getItem(KEY)); } catch (e) { return null; } }
    var refreshing = null;
    function token() {
      var s = sesGet(); if (!s || !s.access_token) return Promise.reject(new Error('로그인이 필요합니다 — 빠른 콘솔에서 다시 로그인해 주세요.'));
      if ((s.expires_at || 0) * 1000 > Date.now() + 90000) return Promise.resolve(s.access_token);
      if (!refreshing) refreshing = fetch(cfg.url + '/auth/v1/token?grant_type=refresh_token', { method: 'POST', headers: { apikey: cfg.anon, 'Content-Type': 'application/json' }, body: JSON.stringify({ refresh_token: s.refresh_token }) })
        .then(function (r) { return r.json(); }).then(function (n) { refreshing = null; if (!n || !n.access_token) throw new Error('로그인이 만료됐습니다 — 빠른 콘솔에서 다시 로그인해 주세요.'); var keep = Object.assign({}, s, n); if (!keep.expires_at && n.expires_in) keep.expires_at = Math.floor(Date.now() / 1000) + n.expires_in; localStorage.setItem(KEY, JSON.stringify(keep)); return n.access_token; }, function (e) { refreshing = null; throw e; });
      return refreshing;
    }
    function call(fn, args, ok, bad, uo, ck) {
      // 2026-10-21 보기 화면: 슈퍼베이스에 남은 지난 결과를 먼저 그리고(meta.cached), 구글 서버의 새 결과가 다르면 다시 그린다
      var live = false, shown = null;
      token().then(function (tok) {
        if (ck && ok) {
          fetch(cfg.url + '/rest/v1/console_views?select=data,updated_at&org_id=eq.' + encodeURIComponent(cfg.org) + '&key=eq.' + encodeURIComponent('rpc:' + ck), { headers: { apikey: cfg.anon, Authorization: 'Bearer ' + tok } })
            .then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
              var row = rows && rows[0]; if (!row || live) return;
              shown = JSON.stringify(row.data); try { ok(row.data, uo, { cached: true, at: row.updated_at }); } catch (e) { console.error('[rpc 미리]', fn, e); }
            }).catch(function () {});
        }
        return fetch(cfg.gas + '?type=rpc', { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ fn: fn, args: args, tok: tok, ck: ck || '' }) });
      }).then(function (r) { return r.json(); }).then(function (j) {
        live = true;
        if (j && j.ok) { if (ok && !(shown !== null && shown === JSON.stringify(j.v))) ok(j.v, uo, { cached: false }); else if (shown !== null) document.dispatchEvent(new CustomEvent('jj-rpc-same', { detail: { fn: fn, ck: ck } })); }
        else { var e = new Error((j && j.e) || '서버 응답 없음'); if (bad && shown === null) bad(e, uo); else console.error('[rpc]', fn, e); }
      }).catch(function (e) { live = true; var er = new Error(/Failed to fetch|NetworkError/i.test(String(e && e.message)) ? (navigator.onLine === false ? '인터넷 연결을 확인해 주세요.' : '서버 응답을 받지 못했습니다 — 저장은 됐을 수 있으니 화면을 다시 확인해 주세요.') : String(e && e.message || e)); if (bad && shown === null) bad(er, uo); else console.error('[rpc]', fn, er); });
    }
    function runner(ok, bad, uo, ck) {
      return new Proxy({}, { get: function (t, k) {
        if (k === 'withSuccessHandler') return function (h) { return runner(h, bad, uo, ck); };
        if (k === 'withFailureHandler') return function (h) { return runner(ok, h, uo, ck); };
        if (k === 'withUserObject') return function (o) { return runner(ok, bad, o, ck); };
        if (k === 'withCache') return function (key) { return runner(ok, bad, uo, key); };
        return function () { var a = Array.prototype.slice.call(arguments); call(String(k), a, ok, bad, uo, ck === true ? String(k) + ':' + JSON.stringify(a) : ck); };
      } });
    }
    window.google = window.google || {}; window.google.script = { run: runner(null, null, undefined), host: { close: function () {}, editor: {} }, url: { getLocation: function (cb) { cb({ parameter: {}, parameters: {}, hash: '' }); } } };
    window.__JJ_STATIC = true;
    // 2026-10-21 새 화면이 올라오면 위에 띠를 띄운다 (열어 둔 화면이 옛것인 채로 남지 않게) — 3분마다 확인, 글 쓰는 중엔 방해 안 함
    function newVerCheck() {
      token().then(function (tok) {
        return fetch(cfg.url + '/rest/v1/console_views?select=data&org_id=eq.' + encodeURIComponent(cfg.org) + '&key=eq.app_ver', { headers: { apikey: cfg.anon, Authorization: 'Bearer ' + tok } });
      }).then(function (r) { return r.ok ? r.json() : []; }).then(function (rows) {
        var v = rows && rows[0] && rows[0].data && rows[0].data.ver; if (!v || v === cfg.ver || document.getElementById('jjNewVer')) return;
        var b = document.createElement('div'); b.id = 'jjNewVer';
        b.style.cssText = 'position:fixed;left:50%;top:10px;transform:translateX(-50%);z-index:9999;background:#1f5e46;color:#fff;border-radius:999px;padding:9px 14px 9px 16px;font:600 13px/1.2 system-ui,sans-serif;box-shadow:0 8px 24px rgba(0,0,0,.2);display:flex;gap:10px;align-items:center;max-width:92vw;';
        b.innerHTML = '새 화면이 나왔습니다 <button style="border:0;background:#fff;color:#1f5e46;border-radius:999px;padding:6px 12px;font:inherit;cursor:pointer;" onclick="location.reload()">지금 새로고침</button><button style="border:0;background:transparent;color:#fff;font:inherit;cursor:pointer;padding:4px;" aria-label="닫기" onclick="this.parentNode.remove()">×</button>';
        document.body.appendChild(b);
      }).catch(function () {});
    }
    setTimeout(function () { newVerCheck(); setInterval(newVerCheck, 180000); }, 180000);
  }

  function start(html, snap, c) {
    var cfg = { url: c.url, anon: c.anon, gas: GAS, org: c.org || 'jipjini', ver: (ls.get('jja_app') || {}).ver || '' };
    var js = JSON.stringify(snap).replace(/</g, '\\u003c').replace(/\u2028/g, '\\u2028').replace(/\u2029/g, '\\u2029');
    html = html.replace(/(<script type="application\/json" id="jjSnap">)[\s\S]*?(<\/script>)/, function (m, a, b) { return a + js + b; });
    var head = '<meta name="viewport" content="width=device-width, initial-scale=1"><meta name="robots" content="noindex,nofollow"><link rel="icon" href="/console/icons/icon-192.png">' +
      '<script>(' + shim.toString() + ')(' + JSON.stringify(cfg) + ');<\/script>';
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + head; }) : head + html;
    document.open(); document.write(html); document.close();
  }
})();
</script>
</body>
</html>
