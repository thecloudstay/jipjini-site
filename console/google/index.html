<!DOCTYPE html><html lang="ko"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>집지니 코디 콘솔</title>
<link rel="manifest" href="/console/manifest.webmanifest">
<meta name="theme-color" content="#0B6E4F">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="집지니 콘솔">
<link rel="apple-touch-icon" href="/console/icons/apple-touch-icon.png">
<link rel="icon" href="/console/icons/icon-192.png">
<style>
html,body{margin:0;height:100%;background:#F4F6F8;font-family:-apple-system,BlinkMacSystemFont,'Pretendard','Apple SD Gothic Neo','Malgun Gothic',sans-serif;color:#0F172A;overscroll-behavior:none}
#app{position:fixed;inset:0;border:0;width:100%;height:100%;height:100dvh;background:#F4F6F8}
#hint{position:fixed;left:12px;right:12px;bottom:calc(12px + env(safe-area-inset-bottom));background:#0F172A;color:#fff;border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.5;box-shadow:0 10px 30px rgba(15,23,42,.25);display:none;z-index:9;gap:10px;align-items:flex-start}
#hint b{color:#9FE1C7}#hint button{background:transparent;border:0;color:#fff;font-size:18px;line-height:1;padding:0 2px;cursor:pointer}
#open{position:fixed;right:10px;top:calc(8px + env(safe-area-inset-top));width:30px;height:30px;border-radius:50%;background:rgba(15,23,42,.35);color:#fff;display:flex;align-items:center;justify-content:center;text-decoration:none;font-size:14px;z-index:9;opacity:.55}
#open:hover{opacity:1}
#load{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:#475569;font-size:13px;z-index:5;background:#F4F6F8;transition:opacity .3s}
#load .b{width:44px;height:44px;border-radius:12px;background:#0B6E4F;color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px}
#load.hide{opacity:0;pointer-events:none}
</style></head>
<body>
<div id="load"><div class="b">집</div><div>코디 콘솔 여는 중…</div><div style="font-size:11px;color:#94A3B8">안 열리면 <a href="https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec" style="color:#0B6E4F">새 창으로 열기</a></div></div>
<iframe id="app" allow="clipboard-write; clipboard-read" title="집지니 코디 콘솔"></iframe>
<a id="open" href="https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec" target="_blank" rel="noopener" title="새 창으로 열기">↗</a>
<div id="hint"><div style="flex:1"><b>휴대폰에서 앱처럼 쓰기</b><br>아이폰: 공유 → 「홈 화면에 추가」 · 안드로이드: 메뉴 → 「홈 화면에 추가」(또는 「앱 설치」). 다음부터 주소창 없이 바로 열립니다.</div><button onclick="document.getElementById('hint').style.display='none';try{localStorage.setItem('jj_hint','1')}catch(e){}" aria-label="닫기">×</button></div>
<script>
(function(){
  var EXEC="https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec";
  var f=document.getElementById('app'),l=document.getElementById('load');
  // 로그인 토큰은 jipjini.com 쪽에 보관(30일) → 콘솔을 열 때마다 같이 넘긴다. 콘솔 로그인 화면이 토큰을 postMessage 로 보내 준다.
  function src(){var s='';try{s=localStorage.getItem('jj_s')||''}catch(e){}return EXEC+'?shell=1'+(s?'&s='+encodeURIComponent(s):'');}
  f.src=src();
  window.addEventListener('message',function(ev){var d=ev.data||{};if(d&&d.type==='jipjini_session'&&d.s){try{localStorage.setItem('jj_s',d.s)}catch(e){}f.src=src();}if(d&&d.type==='jipjini_logout'){try{localStorage.removeItem('jj_s')}catch(e){}f.src=src();}});
  f.addEventListener('load',function(){l.classList.add('hide');});
  setTimeout(function(){l.classList.add('hide');},6000);
  var standalone=window.matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
  var mobile=/iPhone|iPad|Android/i.test(navigator.userAgent);
  var seen=false;try{seen=!!localStorage.getItem('jj_hint')}catch(e){}
  if(mobile&&!standalone&&!seen){setTimeout(function(){document.getElementById('hint').style.display='flex';},2500);}
  if(standalone){document.getElementById('open').style.display='none';}
  if('serviceWorker' in navigator){navigator.serviceWorker.register('/console/sw.js').catch(function(){});}
})();
</script>
</body></html>
