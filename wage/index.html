<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f5e46">
<title>노무비 청구 | 집지니</title>
<style>
:root{--g:#1f5e46;--gl:#e6efe9;--bg:#fbf8f1;--card:#fff;--ink:#22262a;--mute:#6f7479;--line:#e7e1d4;--warn:#b5562b;--warnl:#f8e7dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.2px;line-height:1.55;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{background:var(--g);color:#fff;padding:22px 16px 26px}
header .in{max-width:560px;margin:0 auto}
.brand{font-weight:800;letter-spacing:3px;font-size:14px;opacity:.9}
header h1{font-size:22px;font-weight:800;margin-top:8px}
header p{margin-top:4px;font-size:14px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px}
.card h2{font-size:16px;font-weight:800;color:var(--g);margin-bottom:10px}
.note{background:var(--gl);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.note b{color:var(--g)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1.25fr 1fr 34px;gap:6px;align-items:center;margin-top:6px}
.row input{padding:10px}
.x{width:34px;height:40px;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border-radius:10px;padding:11px 14px;border:1px solid var(--g);background:#fff;color:var(--g);cursor:pointer}
.btn.full{width:100%;margin-top:10px}
.btn.main{background:var(--g);color:#fff;font-size:17px;padding:15px}
.btn:disabled{opacity:.6}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:15px}
.sum .k{color:var(--mute)}.sum .v{text-align:right;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:800;font-size:20px;color:var(--g);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.file{display:flex;gap:10px;align-items:center;margin-top:6px}
.file img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.msg{margin-top:10px;font-size:14px;color:var(--warn)}
.ok{text-align:center;padding:26px 10px}
.ok b{display:block;font-size:20px;color:var(--g);margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.small{font-size:12.5px;color:var(--mute);margin-top:8px}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.person{border:2px solid var(--line)}
.person .ph{display:flex;align-items:center;justify-content:space-between;margin-bottom:4px}
.person .ph h2{margin:0}
.rm{border:0;background:none;color:var(--mute);font:inherit;font-size:13px;cursor:pointer;text-decoration:underline}
.get{background:var(--gl);border-radius:12px;padding:12px 14px;margin-top:12px}
.get .big{display:flex;justify-content:space-between;align-items:baseline;font-weight:800;color:var(--g);font-size:20px;margin-top:6px;border-top:1px solid #cfe0d6;padding-top:6px}
.barsum{display:flex;justify-content:space-between;font-size:14px;margin-bottom:8px}
.barsum b{color:var(--g);font-size:17px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:8px}
</style>
</head>
<body>
<header><div class="in"><div class="brand">JIPJINI</div><h1>노무비 청구</h1><p id="who">불러오는 중…</p></div></header>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" style="display:none"><div class="in"><div class="barsum" id="barsum"></div><button class="btn main full" style="margin-top:0" id="send" onclick="send()">청구 보내기</button></div></div>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec';
  var q = location.search, k = (q.match(/[?&]k=([A-Za-z0-9]+)/) || [])[1] || '', st = (q.match(/[?&]s=([A-Za-z0-9]+)/) || [])[1] || '';
  var SITE = !!st, D = null, P = [], $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var won = function (n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; };
  var num = function (v) { return Math.round(Number(String(v == null ? '' : v).replace(/[^0-9]/g, '')) || 0); };
  var ymd = function (d) { d = new Date(d); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  var fl10 = function (n) { return Math.floor(n / 10) * 10; };
  function tax(sum, days) {   // 콘솔(labor_tax.gs)과 같은 계산 — 3.3% 사업소득: 소득세 3% · 지방소득세 0.3% (소득세 1,000원 미만이면 안 뗌)
    var kind = (D && D.소득구분) || '3.3% 사업소득', inc = 0;
    if (kind === '3.3% 사업소득') inc = fl10(sum * 0.03); else if (kind === '일용직') { var d = days || 1; inc = fl10(Math.max(0, sum / d - 150000) * 0.027 * d); }
    if (inc < 1000) inc = 0; var loc = fl10(inc * 0.1); return { 소득세: inc, 지방소득세: loc, 실지급액: sum - inc - loc };
  }
  function blank(name) { return { 이름: name || '', 연락처: '', 주민번호: '', 일당: '', rows: [{ 날짜: ymd(new Date()), 금액: '' }], 은행: '', 계좌번호: '', 예금주: name || '', photo: '' }; }
  function fail(m) { $('who').textContent = ''; $('app').innerHTML = '<div class="card"><p>' + esc(m) + '</p><p class="small">받은 링크를 그대로 눌러 주세요. 안 되면 코디에게 연락 주세요.</p></div>'; }
  if (!k && !st) { fail('링크가 올바르지 않습니다.'); return; }
  fetch(EXEC + (SITE ? '?type=wage_site&s=' + encodeURIComponent(st) : '?type=wage&k=' + encodeURIComponent(k)), { redirect: 'follow', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || d.ok === false) { fail((d && d.err) || '불러오지 못했습니다.'); return; }
    D = d;
    if (SITE) P = [blank('')];
    else { var p = blank(d.이름); p.rows = (d.작업내역 || []).map(function (x) { return { 날짜: x.날짜, 금액: x.금액 }; }); if (!p.rows.length) p.rows = [{ 날짜: ymd(new Date()), 금액: '' }]; p.예금주 = d.예금주 || d.이름; P = [p]; }
    render();
  }).catch(function () { fail('인터넷 연결을 확인하고 다시 열어 주세요.'); });

  function render() {
    $('who').textContent = SITE ? (D.현장 || '') + (D.공종 ? ' · ' + D.공종 : '') : D.이름 + ' 님 · ' + (D.현장 || '') + (D.공종 ? ' · ' + D.공종 : '');
    if (!SITE && D.상태 === '지급완료') { $('app').innerHTML = '<div class="card ok"><b>지급이 끝났습니다</b>' + esc(D.지급일 || '') + ' · ' + won(D.실지급액) + ' 입금</div>' + doneHtml([D]); $('bar').style.display = 'none'; return; }
    $('app').innerHTML = '<div class="note">노무비는 <b>사업소득 3.3%</b>(소득세 3% + 지방소득세 0.3%)를 떼고 입금됩니다. 금액을 넣으면 <b>실제 받으실 금액</b>이 바로 계산됩니다.<br>올려 주시면 <b>검토 후 24시간 안에</b> 입금해 드립니다.' + (!SITE && D.상태 === '청구됨' ? '<br><b>이미 청구하셨습니다.</b> 고칠 것이 있으면 고친 뒤 다시 보내 주세요.' : '') + '</div>' +
      '<div id="people"></div>' + (SITE ? '<button class="btn full" onclick="addP()"><svg class="ico" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M19 8v6M16 11h6"/></svg>같이 일한 인부 추가</button>' : '') +
      '<p class="small">주민등록번호·계좌·통장 사본은 노무비 지급과 세금(원천징수) 신고에만 쓰고, 암호화해 보관합니다.</p><div class="msg" id="msg"></div>';
    $('bar').style.display = ''; drawPeople();
  }
  function drawPeople() {
    $('people').innerHTML = P.map(function (p, i) {
      var nm = SITE ? '<div class="two"><div><label>이름</label><input value="' + esc(p.이름) + '" oninput="setP(' + i + ',\'이름\',this.value)"></div><div><label>휴대전화</label><input inputmode="tel" placeholder="010-0000-0000" value="' + esc(p.연락처) + '" oninput="setP(' + i + ',\'연락처\',this.value)"></div></div>' : '';
      var rrnNote = !SITE && D.주민번호 ? '<p class="small" style="margin-top:2px">받아 둔 번호: ' + esc(D.주민번호) + ' — 바뀌지 않았으면 비워 두세요.</p>' : '';
      var acctNote = !SITE && D.계좌끝 ? '<p class="small" style="margin-top:2px">지난번 계좌: ' + esc(D.은행) + ' ****' + esc(D.계좌끝) + ' — 바뀌었을 때만 새로 적어 주세요.</p>' : '';
      return '<div class="card person"><div class="ph"><h2>' + (SITE ? (i + 1) + '번째 인부' : '청구 내용') + '</h2>' + (SITE && P.length > 1 ? '<button class="rm" onclick="delP(' + i + ')">이 분 빼기</button>' : '') + '</div>' + nm +
        '<label>주민등록번호</label><input inputmode="numeric" maxlength="14" placeholder="000000-0000000" value="' + esc(p.주민번호) + '" oninput="rrn(' + i + ',this)">' + rrnNote +
        '<label>일한 날짜 · 금액</label><div class="quick" style="margin-bottom:4px"><input inputmode="numeric" placeholder="하루 금액(일당) 예: 200000" value="' + (p.일당 ? Number(p.일당).toLocaleString('ko-KR') : '') + '" oninput="rate(' + i + ',this)"><button class="btn" style="margin:0" onclick="fill(' + i + ')">모든 날에 넣기</button></div>' +
        '<div id="rows' + i + '">' + rowsHtml(p, i) + '</div><button class="btn full" onclick="addR(' + i + ')"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>하루 더 추가</button>' +
        '<div class="get" id="get' + i + '"></div>' +
        '<label>은행</label><input list="banks" placeholder="예: 국민은행" value="' + esc(p.은행) + '" oninput="setP(' + i + ',\'은행\',this.value)">' +
        '<div class="two"><div><label>계좌번호</label><input inputmode="numeric" placeholder="숫자만" value="' + esc(p.계좌번호) + '" oninput="this.value=this.value.replace(/[^0-9-]/g,\'\');setP(' + i + ',\'계좌번호\',this.value)"></div><div><label>예금주</label><input placeholder="비우면 본인 이름" value="' + esc(p.예금주) + '" oninput="setP(' + i + ',\'예금주\',this.value)"></div></div>' + acctNote +
        '<label>통장 사본</label><div class="file"><label class="btn" style="margin:0;color:var(--g)"><svg class="ico" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진 찍기·고르기<input type="file" accept="image/*,application/pdf" onchange="pick(' + i + ',this)" style="display:none"></label><span id="pv' + i + '">' + (p.photo ? '<img src="' + p.photo + '" alt="통장 사본">' : (!SITE && D.통장사본 ? '<span class="small">이미 받았습니다</span>' : '')) + '</span></div></div>';
    }).join('') + '<datalist id="banks"><option>국민은행<option>신한은행<option>우리은행<option>하나은행<option>농협은행<option>지역농협<option>기업은행<option>카카오뱅크<option>토스뱅크<option>케이뱅크<option>새마을금고<option>신협<option>우체국<option>수협</datalist>';
    P.forEach(function (_, i) { calc(i); }); total();
  }
  function rowsHtml(p, i) {
    return p.rows.map(function (r, j) { return '<div class="row"><input type="date" value="' + esc(r.날짜) + '" onchange="setR(' + i + ',' + j + ',\'날짜\',this.value)"><input inputmode="numeric" placeholder="금액" value="' + (r.금액 ? Number(r.금액).toLocaleString('ko-KR') : '') + '" oninput="setR(' + i + ',' + j + ',\'금액\',this)"><button class="x" onclick="delR(' + i + ',' + j + ')" aria-label="이 날 지우기">&times;</button></div>'; }).join('');
  }
  function lines(p) { return p.rows.filter(function (r) { return r.날짜 && num(r.금액) > 0; }); }
  function calc(i) {
    var p = P[i], L = lines(p), sum = L.reduce(function (s, r) { return s + num(r.금액); }, 0), t = tax(sum, L.length), el = $('get' + i); if (!el) return;
    el.innerHTML = '<div class="sum"><span class="k">일한 날</span><span class="v">' + L.length + '일</span><span class="k">청구 금액</span><span class="v">' + won(sum) + '</span>' +
      '<span class="k">3.3% 떼는 금액</span><span class="v">− ' + won(t.소득세 + t.지방소득세) + '</span></div><div class="big"><span>실제 받으실 금액</span><span>' + won(t.실지급액) + '</span></div>' +
      (t.소득세 ? '<p class="small" style="margin-top:4px">소득세 ' + won(t.소득세) + ' + 지방소득세 ' + won(t.지방소득세) + ' — 나라에 대신 내 드리는 세금입니다.</p>' : '');
  }
  function total() {
    var n = 0, s = 0; P.forEach(function (p) { var L = lines(p); if (!L.length) return; n++; s += tax(L.reduce(function (a, r) { return a + num(r.금액); }, 0), L.length).실지급액; });
    $('barsum').innerHTML = '<span>' + (SITE ? n + '명 · ' : '') + '실제 받으실 금액 합계</span><b>' + won(s) + '</b>';
  }
  window.setP = function (i, key, v) { P[i][key] = v; };
  window.rrn = function (i, el) { var d = el.value.replace(/[^0-9]/g, '').slice(0, 13); el.value = d.length > 6 ? d.slice(0, 6) + '-' + d.slice(6) : d; P[i].주민번호 = el.value; };
  window.rate = function (i, el) { var v = num(el.value); P[i].일당 = v; el.value = v ? v.toLocaleString('ko-KR') : ''; };
  window.fill = function (i) { var r = num(P[i].일당); if (!r) { $('msg').textContent = '하루 금액(일당)을 먼저 넣어 주세요.'; return; } P[i].rows.forEach(function (x) { x.금액 = r; }); $('rows' + i).innerHTML = rowsHtml(P[i], i); calc(i); total(); };
  window.setR = function (i, j, key, v) { if (key === '금액') { var n = num(v.value); P[i].rows[j].금액 = n; v.value = n ? n.toLocaleString('ko-KR') : ''; } else P[i].rows[j][key] = v; calc(i); total(); };
  window.addR = function (i) { var R = P[i].rows, last = R[R.length - 1], d = last && last.날짜 ? new Date(last.날짜 + 'T00:00:00') : new Date(); if (last && last.날짜) d.setDate(d.getDate() + 1); R.push({ 날짜: ymd(d), 금액: (last && last.금액) || num(P[i].일당) || '' }); $('rows' + i).innerHTML = rowsHtml(P[i], i); calc(i); total(); };
  window.delR = function (i, j) { P[i].rows.splice(j, 1); if (!P[i].rows.length) P[i].rows.push({ 날짜: ymd(new Date()), 금액: '' }); $('rows' + i).innerHTML = rowsHtml(P[i], i); calc(i); total(); };
  window.addP = function () { var p = blank(''), f = P[0]; if (f) p.rows = f.rows.map(function (r) { return { 날짜: r.날짜, 금액: '' }; }); P.push(p); drawPeople(); setTimeout(function () { var c = document.querySelectorAll('.person'); c[c.length - 1].scrollIntoView({ behavior: 'smooth' }); }, 50); };
  window.delP = function (i) { if (!confirm((P[i].이름 || (i + 1) + '번째 분') + '을 뺄까요?')) return; P.splice(i, 1); drawPeople(); };
  window.pick = function (i, inp) {
    var f = inp.files && inp.files[0]; if (!f) return;
    if (f.type === 'application/pdf') { var fr = new FileReader(); fr.onload = function () { P[i].photo = fr.result; $('pv' + i).innerHTML = '<span class="small">PDF 선택됨</span>'; }; fr.readAsDataURL(f); return; }
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () { var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); P[i].photo = c.toDataURL('image/jpeg', 0.8); $('pv' + i).innerHTML = '<img src="' + P[i].photo + '" alt="통장 사본">'; URL.revokeObjectURL(url); };
    img.onerror = function () { $('msg').textContent = '사진을 읽지 못했습니다. 다른 사진으로 해 주세요.'; }; img.src = url;
  };
  function check() {
    for (var i = 0; i < P.length; i++) {
      var p = P[i], who = SITE ? (p.이름 || (i + 1) + '번째 분') + ': ' : '';
      if (SITE && !p.이름.trim()) return (i + 1) + '번째 분 이름을 적어 주세요.';
      if (SITE && p.연락처.replace(/[^0-9]/g, '').length < 10) return who + '휴대전화 번호를 적어 주세요.';
      var r = p.주민번호.replace(/[^0-9]/g, ''); if (r.length !== 13 && (SITE || !D.주민번호 || r.length)) return who + '주민등록번호 13자리를 적어 주세요.';
      if (!lines(p).length) return who + '일한 날짜와 금액을 넣어 주세요.';
      if (!p.예금주.trim() && p.이름.trim()) p.예금주 = p.이름.trim();   // 예금주를 비우면 본인 이름으로
      var hasAcct = p.은행.trim() && p.계좌번호.replace(/-/g, '').length >= 8 && p.예금주.trim(); if (!hasAcct && (SITE || !D.계좌끝)) return who + '은행·계좌번호·예금주를 적어 주세요.';
      if (!p.photo && (SITE || !D.통장사본)) return who + '통장 사본 사진을 올려 주세요.';
    }
    return '';
  }
  window.send = function () {
    var m = $('msg'), err = check(); m.textContent = err; if (err) { m.scrollIntoView({ behavior: 'smooth', block: 'center' }); return; }
    var b = $('send'); b.disabled = true; b.textContent = '보내는 중…';
    var pack = function (p) { return { 이름: p.이름, 연락처: p.연락처, 주민번호: p.주민번호, 작업내역: lines(p).map(function (r) { return { 날짜: r.날짜, 금액: num(r.금액) }; }), 은행: p.은행.trim(), 계좌번호: p.계좌번호, 예금주: p.예금주.trim(), 사진: p.photo }; };
    var body = SITE ? { s: st, 사람: P.map(pack) } : Object.assign({ k: k }, pack(P[0]));
    fetch(EXEC + '?type=' + (SITE ? 'wage_site_submit' : 'wage_submit'), { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(body) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (!d || d.ok === false) { b.disabled = false; b.textContent = '청구 보내기'; m.textContent = (d && d.err) || '보내지 못했습니다. 다시 눌러 주세요.'; return; }
        $('bar').style.display = 'none'; var list = SITE ? d.사람 : [d], tot = list.reduce(function (s, x) { return s + x.실지급액; }, 0);
        $('app').innerHTML = '<div class="card ok"><b>청구를 받았습니다</b>검토 후 24시간 안에 입금해 드립니다' + (d.기한 ? ' (' + esc(d.기한) + '까지)' : '') + '.<br>실제 받으실 금액 ' + (list.length > 1 ? list.length + '명 합계 ' : '') + '<b style="display:inline;font-size:inherit">' + won(tot) + '</b></div>' + doneHtml(list) +
          '<p class="small" style="text-align:center">문의: 코디 ' + esc(D.코디) + '</p>';
        window.scrollTo(0, 0);
      }).catch(function () { b.disabled = false; b.textContent = '청구 보내기'; m.textContent = '인터넷 연결을 확인하고 다시 눌러 주세요.'; });
  };
  function doneHtml(list) {
    return list.map(function (x) { return '<div class="card"><h2>' + esc(x.이름) + '</h2><div class="sum"><span class="k">일한 날</span><span class="v">' + (x.일수 || (x.작업내역 || []).length) + '일</span><span class="k">청구 금액</span><span class="v">' + won(x.청구합계) + '</span><span class="k">3.3% 떼는 금액</span><span class="v">− ' + won((x.소득세 || 0) + (x.지방소득세 || 0)) + '</span><span class="k tot">실제 받으실 금액</span><span class="v tot">' + won(x.실지급액) + '</span></div></div>'; }).join('');
  }
})();
