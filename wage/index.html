<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f5e46">
<title>노무비 청구 | 집지니</title>
<style>
:root{--g:#1f5e46;--gl:#e6efe9;--bg:#fbf8f1;--card:#fff;--ink:#22262a;--mute:#6f7479;--line:#e7e1d4;--warn:#b5562b;--warnl:#f8e7dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.2px;line-height:1.55;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 120px}
header{background:var(--g);color:#fff;padding:22px 16px 26px}
header .in{max-width:560px;margin:0 auto}
.brand{font-weight:800;letter-spacing:3px;font-size:14px;opacity:.9}
header h1{font-size:22px;font-weight:800;margin-top:8px}
header p{margin-top:4px;font-size:14px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px}
.card h2{font-size:16px;font-weight:800;color:var(--g);margin-bottom:10px}
.note{background:var(--gl);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.note b{color:var(--g)}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink)}
.row{display:grid;grid-template-columns:1.25fr 1fr 34px;gap:6px;align-items:center;margin-top:6px}
.row input{padding:10px}
.x{width:34px;height:40px;border:0;background:none;color:var(--mute);font-size:22px;cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border-radius:10px;padding:11px 14px;border:1px solid var(--g);background:#fff;color:var(--g);cursor:pointer}
.btn.full{width:100%;margin-top:10px}
.btn.main{background:var(--g);color:#fff;font-size:17px;padding:15px}
.btn:disabled{opacity:.6}
.sum{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:15px}
.sum .k{color:var(--mute)}.sum .v{text-align:right;font-variant-numeric:tabular-nums}
.sum .tot{font-weight:800;font-size:20px;color:var(--g);border-top:1px solid var(--line);padding-top:8px;margin-top:4px}
.file{display:flex;gap:10px;align-items:center;margin-top:6px}
.file img{width:64px;height:64px;object-fit:cover;border-radius:8px;border:1px solid var(--line)}
.msg{margin-top:10px;font-size:14px;color:var(--warn)}
.ok{text-align:center;padding:26px 10px}
.ok b{display:block;font-size:20px;color:var(--g);margin-bottom:6px}
.bar{position:fixed;left:0;right:0;bottom:0;background:#fff;border-top:1px solid var(--line);padding:10px 16px calc(10px + env(safe-area-inset-bottom))}
.bar .in{max-width:560px;margin:0 auto}
.small{font-size:12.5px;color:var(--mute);margin-top:8px}
.ico{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
</style>
</head>
<body>
<header><div class="in"><div class="brand">JIPJINI</div><h1>노무비 청구</h1><p id="who">불러오는 중…</p></div></header>
<div class="wrap" id="app"></div>
<div class="bar" id="bar" style="display:none"><div class="in"><button class="btn main full" id="send" onclick="send()">청구 보내기</button></div></div>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec';
  var k = (location.search.match(/[?&]k=([A-Za-z0-9]+)/) || [])[1] || '', D = null, rows = [], photo = '', $ = function (id) { return document.getElementById(id); };
  var esc = function (s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var won = function (n) { return Number(n || 0).toLocaleString('ko-KR') + '원'; };
  var num = function (v) { return Math.round(Number(String(v == null ? '' : v).replace(/[^0-9]/g, '')) || 0); };
  var today = function () { var d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
  var fl10 = function (n) { return Math.floor(n / 10) * 10; };
  function tax(sum, days) {   // 콘솔(labor_tax.gs)과 같은 계산
    var kind = (D && D.소득구분) || '3.3% 사업소득', inc = 0;
    if (kind === '3.3% 사업소득') inc = fl10(sum * 0.03);
    else if (kind === '일용직') { var d = days || 1; inc = fl10(Math.max(0, sum / d - 150000) * 0.027 * d); }
    if (inc < 1000) inc = 0; var loc = fl10(inc * 0.1); return { 소득세: inc, 지방소득세: loc, 실지급액: sum - inc - loc };
  }
  function fail(m) { $('who').textContent = ''; $('app').innerHTML = '<div class="card"><p>' + esc(m) + '</p><p class="small">문자로 받은 링크를 그대로 눌러 주세요. 안 되면 코디에게 연락 주세요.</p></div>'; }
  if (!k) { fail('링크가 올바르지 않습니다.'); return; }
  fetch(EXEC + '?type=wage&k=' + encodeURIComponent(k), { redirect: 'follow', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || d.ok === false) { fail((d && d.err) || '불러오지 못했습니다.'); return; }
    D = d; rows = (d.작업내역 || []).map(function (x) { return { 날짜: x.날짜, 금액: x.금액 }; }); if (!rows.length) rows.push({ 날짜: today(), 금액: '' });
    render();
  }).catch(function () { fail('인터넷 연결을 확인하고 다시 열어 주세요.'); });

  function render() {
    $('who').textContent = D.이름 + ' 님 · ' + (D.현장 || '') + (D.공종 ? ' · ' + D.공종 : '');
    if (D.상태 === '지급완료') {
      $('app').innerHTML = '<div class="card ok"><b>지급이 끝났습니다</b>' + esc(D.지급일 || '') + ' · ' + won(D.실지급액) + ' 입금</div>' + sumHtml() + '<p class="small" style="text-align:center">문의: 코디 ' + esc(D.코디) + '</p>';
      $('bar').style.display = 'none'; return;
    }
    var three = (D.소득구분 || '3.3% 사업소득') === '3.3% 사업소득';
    $('app').innerHTML =
      '<div class="note">' + (three ? '노무비는 <b>사업소득 3.3%</b>(소득세 3% + 지방소득세 0.3%)를 떼고 남은 금액이 입금됩니다. 아래에 받으실 금액이 바로 계산됩니다.' : '세금을 뗀 뒤 남은 금액이 입금됩니다. 아래에서 받으실 금액을 확인하세요.') + (D.상태 === '청구됨' ? '<br><b>이미 청구하셨습니다.</b> 고칠 것이 있으면 고친 뒤 다시 보내 주세요.' : '') + '</div>' +
      '<div class="card"><h2>① 일한 날짜 · 금액</h2>' +
      '<div class="quick"><div><label>하루 금액(일당)</label><input id="rate" inputmode="numeric" placeholder="예: 200000" oninput="this.value=this.value.replace(/[^0-9]/g,\'\')"></div><div><label>&nbsp;</label><button class="btn full" style="margin:0" onclick="fillRate()">모든 줄에 넣기</button></div></div>' +
      '<div id="rows"></div><button class="btn full" onclick="addRow()"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>하루 더 추가</button></div>' +
      '<div class="card"><h2>② 받으실 금액</h2><div id="sum"></div></div>' +
      '<div class="card"><h2>③ 받으실 계좌</h2>' + (D.계좌끝 ? '<p class="small" style="margin-top:0">지난번 계좌: ' + esc(D.은행) + ' ****' + esc(D.계좌끝) + ' (' + esc(D.예금주) + ') — 바뀌었을 때만 새로 적어 주세요.</p>' : '') +
      '<label>은행</label><input id="bank" list="banks" placeholder="예: 국민은행" value="' + esc(D.계좌끝 ? '' : '') + '"><datalist id="banks"><option>국민은행<option>신한은행<option>우리은행<option>하나은행<option>농협은행<option>지역농협<option>기업은행<option>카카오뱅크<option>토스뱅크<option>케이뱅크<option>새마을금고<option>신협<option>우체국<option>수협</datalist>' +
      '<label>계좌번호</label><input id="acct" inputmode="numeric" placeholder="숫자만" oninput="this.value=this.value.replace(/[^0-9-]/g,\'\')">' +
      '<label>예금주</label><input id="holder" value="' + esc(D.계좌끝 ? '' : D.이름) + '">' +
      '<label>통장 사본 (사진)</label><div class="file"><label class="btn" style="margin:0;color:var(--g)"><svg class="ico" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>사진 찍기·고르기<input id="pic" type="file" accept="image/*,application/pdf" onchange="pick(this)" style="display:none"></label><span id="picv">' + (D.통장사본 ? '<span class="small">이미 받았습니다</span>' : '') + '</span></div>' +
      '<p class="small">계좌와 통장 사본은 지급과 세금 신고에만 쓰고 다른 곳에 보내지 않습니다.</p></div>' +
      '<div class="msg" id="msg"></div>';
    $('bar').style.display = ''; drawRows();
  }
  function drawRows() {
    $('rows').innerHTML = rows.map(function (r, i) {
      return '<div class="row"><input type="date" value="' + esc(r.날짜) + '" onchange="setR(' + i + ',\'날짜\',this.value)"><input inputmode="numeric" placeholder="금액" value="' + (r.금액 ? Number(r.금액).toLocaleString('ko-KR') : '') + '" oninput="setR(' + i + ',\'금액\',this.value)"><button class="x" onclick="delRow(' + i + ')" aria-label="줄 지우기">&times;</button></div>';
    }).join(''); calc();
  }
  function calc() {
    var L = rows.filter(function (r) { return r.날짜 && num(r.금액) > 0; }), sum = L.reduce(function (s, r) { return s + num(r.금액); }, 0), t = tax(sum, L.length);
    var el = $('sum'); if (el) el.innerHTML = sumBody(L.length, sum, t);
  }
  function sumBody(days, sum, t) {
    return '<div class="sum"><span class="k">일한 날</span><span class="v">' + days + '일</span><span class="k">청구 금액</span><span class="v">' + won(sum) + '</span>' +
      '<span class="k">소득세 (3%)</span><span class="v">− ' + won(t.소득세) + '</span><span class="k">지방소득세 (0.3%)</span><span class="v">− ' + won(t.지방소득세) + '</span>' +
      '<span class="k tot">받으실 금액</span><span class="v tot">' + won(t.실지급액) + '</span></div>';
  }
  function sumHtml() { return '<div class="card"><h2>내역</h2>' + (D.작업내역 || []).map(function (x) { return '<div class="sum"><span class="k">' + esc(x.날짜) + '</span><span class="v">' + won(x.금액) + '</span></div>'; }).join('') + '<div style="margin-top:8px">' + sumBody((D.작업내역 || []).length, D.청구합계, D) + '</div></div>'; }
  window.setR = function (i, key, v) { rows[i][key] = key === '금액' ? num(v) : v; if (key === '금액') { var inp = document.querySelectorAll('#rows .row')[i].children[1], pos = v.length; inp.value = rows[i].금액 ? rows[i].금액.toLocaleString('ko-KR') : ''; } calc(); };
  window.addRow = function () { var last = rows[rows.length - 1], d = last && last.날짜 ? new Date(last.날짜 + 'T00:00:00') : new Date(); if (last && last.날짜) d.setDate(d.getDate() + 1); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); rows.push({ 날짜: d.toISOString().slice(0, 10), 금액: last ? last.금액 : '' }); drawRows(); };
  window.delRow = function (i) { rows.splice(i, 1); if (!rows.length) rows.push({ 날짜: today(), 금액: '' }); drawRows(); };
  window.fillRate = function () { var r = num($('rate').value); if (!r) return; rows.forEach(function (x) { x.금액 = r; }); drawRows(); };
  window.pick = function (inp) {
    var f = inp.files && inp.files[0]; if (!f) return; photo = '';
    if (f.type === 'application/pdf') { var fr = new FileReader(); fr.onload = function () { photo = fr.result; $('picv').innerHTML = '<span class="small">PDF 선택됨</span>'; }; fr.readAsDataURL(f); return; }
    var img = new Image(), url = URL.createObjectURL(f);
    img.onload = function () { var s = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas'); c.width = Math.round(img.width * s); c.height = Math.round(img.height * s); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height); photo = c.toDataURL('image/jpeg', 0.82); $('picv').innerHTML = '<img src="' + photo + '" alt="통장 사본">'; URL.revokeObjectURL(url); };
    img.onerror = function () { $('msg').textContent = '사진을 읽지 못했습니다. 다른 사진으로 해 주세요.'; };
    img.src = url;
  };
  window.send = function () {
    var L = rows.filter(function (r) { return r.날짜 && num(r.금액) > 0; }).map(function (r) { return { 날짜: r.날짜, 금액: num(r.금액) }; });
    var bank = $('bank').value.trim(), acct = $('acct').value.trim(), holder = $('holder').value.trim(), m = $('msg'); m.textContent = '';
    if (!L.length) { m.textContent = '일하신 날짜와 금액을 한 줄 이상 넣어 주세요.'; return; }
    if (!D.계좌끝 && (!bank || acct.replace(/-/g, '').length < 8 || !holder)) { m.textContent = '은행·계좌번호·예금주를 모두 적어 주세요.'; return; }
    if (!D.통장사본 && !photo) { m.textContent = '통장 사본 사진을 올려 주세요.'; return; }
    var b = $('send'); b.disabled = true; b.textContent = '보내는 중…';
    fetch(EXEC + '?type=wage_submit', { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: k, 작업내역: L, 은행: bank, 계좌번호: acct, 예금주: holder, 사진: photo }) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (!d || d.ok === false) { b.disabled = false; b.textContent = '청구 보내기'; m.textContent = (d && d.err) || '보내지 못했습니다. 다시 눌러 주세요.'; return; }
        D = d; $('bar').style.display = 'none';
        $('app').innerHTML = '<div class="card ok"><b>청구를 받았습니다</b>확인 후 ' + won(d.실지급액) + '을 보내 드립니다.</div>' + sumHtml() + '<p class="small" style="text-align:center">고칠 것이 있으면 이 링크를 다시 열어 주세요 · 코디 ' + esc(d.코디) + '</p>';
        window.scrollTo(0, 0);
      }).catch(function () { b.disabled = false; b.textContent = '청구 보내기'; m.textContent = '인터넷 연결을 확인하고 다시 눌러 주세요.'; });
  };
})();
</script>
</body>
</html>
