<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>집지니 · 시공 공정표</title>
<meta property="og:title" content="집지니 · 시공 공정표">
<meta property="og:description" content="공정별 일정과 진행 상황을 한눈에 확인하세요. 일정이 바뀌면 이 링크에 바로 반영됩니다.">
<meta property="og:image" content="https://jipjini.com/og-cover.png">
<meta property="og:type" content="website">
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Nanum+Myeongjo:wght@700;800&display=swap" rel="stylesheet">
<style>
:root{--charcoal:#2A2A2A;--gray:#6B6B6B;--line:#E2DCCD;--oat:#F5F1E8;--oat-soft:#FBF8F1;--clay:#9a5a4a;--green:#1f6b4a;--white:#fff;
--serif:'Nanum Myeongjo',serif;--sans:'Pretendard','Apple SD Gothic Neo',sans-serif}
*{margin:0;padding:0;box-sizing:border-box}
body{background:var(--oat-soft);font-family:var(--sans);color:var(--charcoal);-webkit-font-smoothing:antialiased;letter-spacing:-.2px}
.wrap{max-width:720px;margin:0 auto;padding:30px 16px 72px}
.brand{font-family:var(--serif);font-weight:800;font-size:15px;color:var(--clay);letter-spacing:2px}
h1{font-family:var(--serif);font-weight:800;font-size:25px;line-height:1.4;margin:10px 0 6px}
.meta{font-size:13px;color:var(--gray);line-height:1.7}
.sum{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:16px}@media(max-width:420px){.sum{grid-template-columns:repeat(2,1fr)}}
.sum div{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:12px 10px;text-align:center}
.sum b{display:block;font-family:var(--serif);font-size:16px;margin-top:3px;white-space:nowrap}.sum span{font-size:11.5px;color:var(--gray)}
.prog{height:8px;background:var(--oat);border-radius:4px;margin-top:14px;overflow:hidden;position:relative}.prog em{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--charcoal,#333);opacity:.55}.pay h2{font-size:15px;margin:0 0 10px}.pr{display:grid;grid-template-columns:78px 1fr auto;gap:10px;align-items:center;padding:10px 0;border-bottom:1px dashed #e4ddd0}.pr:last-of-type{border-bottom:none}.pd{font-size:13px;color:#9a5b4a;font-weight:700}.pd small{font-weight:400;color:#777}.pw b{font-size:14px}.ps{display:inline-block;margin-left:6px;font-size:11px;padding:2px 8px;border-radius:10px;background:#f3eee4;color:#777}.pr.ok .ps{background:#e3f1e6;color:#1a6b3a}.pr.late .ps{background:#fde8e4;color:#b23b2a}.pa{font-weight:700;font-size:15px}.ptot{display:flex;justify-content:space-between;margin-top:12px;padding-top:10px;border-top:2px solid #333;font-size:14px}.ptot b{font-size:17px}.pnote{font-size:12px;color:#777;margin-top:6px}.pmeta{font-size:12px;color:#777;margin-top:6px}.prog i{display:block;height:100%;background:var(--green)}
.card{background:var(--white);border:1px solid var(--line);border-radius:14px;padding:6px 14px;margin-top:14px}
.ph{display:grid;grid-template-columns:86px 1fr;gap:10px;padding:13px 0;border-bottom:1px dashed var(--line)}.ph:last-child{border-bottom:none}
.ph .d{font-size:12.5px;color:var(--clay);font-weight:700;line-height:1.5}.ph .d small{display:block;color:var(--gray);font-weight:500;font-size:11px}
.ph b{font-size:15px}.ph .t{font-size:12.5px;color:var(--gray);margin-top:2px;line-height:1.5}
.st{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;margin-left:6px;vertical-align:1px}
.st.done{background:#e3f1e9;color:var(--green)}.st.now{background:#fde9d9;color:#b4521f}.st.plan{background:var(--oat);color:var(--gray)}.st.hold{background:#eee;color:#888}
.ph.now{background:linear-gradient(90deg,#fff7f0,transparent);margin:0 -14px;padding:13px 14px}
.gantt{margin-top:8px;position:relative;height:6px;background:var(--oat);border-radius:3px}.gantt i{position:absolute;top:0;height:100%;border-radius:3px;background:var(--clay);opacity:.75}.ph.done .gantt i{background:var(--green)}
.share{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:18px}
.share button,.share a{font:inherit;font-size:14px;font-weight:700;border-radius:12px;padding:14px 8px;text-align:center;text-decoration:none;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--charcoal)}
.share .kk{background:#FEE500;border-color:#FEE500;color:#191919;grid-column:1/-1;font-size:15.5px}
.cta{display:block;text-align:center;margin-top:10px;background:var(--clay);color:#fff;text-decoration:none;font-weight:700;padding:15px;border-radius:12px;font-size:15px}
.note{background:var(--oat);border-radius:12px;padding:13px 15px;margin-top:14px;font-size:13px;line-height:1.75;color:#444}
.foot{font-size:12px;color:var(--gray);text-align:center;margin-top:26px;line-height:1.8}
.err{text-align:center;padding:80px 0;color:var(--gray);line-height:1.9}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--charcoal);color:#fff;padding:10px 16px;border-radius:10px;font-size:13px;display:none;z-index:9}
@media print{.share,.cta,.note{display:none}body{background:#fff}}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="err">공정표를 불러오는 중…</div></div>
<div class="toast" id="toast"></div>
<script>
(function(){
  var app=document.getElementById('app');
  var id=(new URLSearchParams(location.search).get('id')||'').replace(/[^A-Za-z0-9_-]/g,'');
  // 집지니 카톡봇 웹앱 (?w=공정표ID) — 콘솔 「공정표」 시트를 바로 읽는다(1분 캐시)
  var API='https://script.google.com/macros/s/AKfycbyTMw196qwKBmpz_TA3erW4OcBsmRFWTYioecO5evjq4poPOEXpyqkSKZZ91eTHWUI-/exec';
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return{'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]})}
  var WD=['일','월','화','수','목','금','토'];
  function md(d){if(!d)return'';var x=new Date(d+'T00:00:00');return (x.getFullYear()!==new Date().getFullYear()?x.getFullYear()+'년 ':'')+(x.getMonth()+1)+'/'+x.getDate()+'('+WD[x.getDay()]+')'}
  function days(s,e){return Math.round((new Date(e+'T00:00:00')-new Date(s+'T00:00:00'))/864e5)+1}
  function toast(t){var el=document.getElementById('toast');el.textContent=t;el.style.display='block';setTimeout(function(){el.style.display='none'},2200)}
  // 2026-10-05 「없음」과 「연결 지연」을 나눠 보여 주고, 공정표 번호를 같이 보여 준다(문의 때 바로 찾게)
  function fail(kind){
    var net=kind==='net';
    app.innerHTML='<div class="err">'+(net?'공정표를 불러오지 못했습니다.<br>인터넷 연결이 느리거나 잠시 지연되고 있습니다.<br><a class="cta" href="javascript:location.reload()" style="background:#2A2A2A">다시 불러오기</a>':'공정표를 찾을 수 없습니다.<br>링크가 정확한지 확인해 주시거나<br>카카오톡 채널 <b>@집지니</b>로 문의해 주세요.')+
      (id?'<div style="font-size:12px;color:#999;margin-top:14px">공정표 번호 '+esc(id)+'</div>':'')+'<a class="cta" href="https://pf.kakao.com/_NjpxhC/chat">카톡 문의하기</a></div>';
  }
  if(!id){fail();return}
  var today=new Date();today=today.getFullYear()+'-'+String(today.getMonth()+1).padStart(2,'0')+'-'+String(today.getDate()).padStart(2,'0');
  function state(p){if(/완료/.test(p.status))return['done','완료'];if(/중단|보류/.test(p.status))return['hold',p.status];if(/진행/.test(p.status)||(p.start<=today&&p.end>=today))return['now','진행 중'];if(p.end&&p.end<today)return['hold','일정 지남'];return['plan','예정']}   // 2026-10-05 날짜만 지났다고 「완료」로 보이지 않게 — 코디가 완료 처리한 공정만 완료
  function render(d){
    var total=days(d.start,d.end),ph=d.phases||[];
    var doneN=ph.filter(function(p){return state(p)[0]==='done'}).length;
    // 2026-10-06 공정률: 공정 기간(일)으로 가중 — 완료 100%, 진행 중은 지난 날만큼(최대 90%), 예정 0%. 계획 공정률은 오늘 날짜 기준
    var wSum=0,wDone=0,wPlan=0;ph.forEach(function(p){var n=days(p.start,p.end)||1,st=state(p)[0],gone=p.start>today?0:Math.min(n,days(p.start,today<p.end?today:p.end));wSum+=n;wPlan+=gone;wDone+=st==='done'?n:(st==='now'?Math.min(n*0.9,Math.max(0,gone-1)+0.5):0)});
    var pct=wSum?Math.round(wDone*100/wSum):0,plan=wSum?Math.round(wPlan*100/wSum):0;
    var dd=Math.round((new Date(d.start+'T00:00:00')-new Date(today+'T00:00:00'))/864e5);
    var headline=d.start>today?'착공까지 '+dd+'일':(ph.length&&doneN===ph.length?'공사 완료':d.end<today?'마무리 확인 중':'공사 '+(Math.round((new Date(today+'T00:00:00')-new Date(d.start+'T00:00:00'))/864e5)+1)+'일째');
    var s0=new Date(d.start+'T00:00:00').getTime(),span=Math.max(1,new Date(d.end+'T00:00:00').getTime()-s0+864e5);
    var rows=ph.map(function(p){var st=state(p),l=Math.max(0,(new Date(p.start+'T00:00:00').getTime()-s0)/span*100),w=Math.max(2,days(p.start,p.end)*864e5/span*100);
      return '<div class="ph '+st[0]+'"><div class="d">'+md(p.start)+(p.end&&p.end!==p.start?'<br>~ '+md(p.end):'')+'<small>'+days(p.start,p.end)+'일</small></div><div><b>'+esc(p.label)+'</b><span class="st '+st[0]+'">'+st[1]+'</span>'+
        (p.trades&&p.trades!==p.label?'<div class="t">'+esc(p.trades)+'</div>':'')+(p.worker?'<div class="t">담당 '+esc(p.worker)+'</div>':'')+(p.memo?'<div class="t" style="color:#1a472a;background:#f2f7f2;border-radius:6px;padding:4px 7px;margin-top:3px;white-space:pre-wrap">📌 '+esc(p.memo)+'</div>':'')+'<div class="gantt"><i style="left:'+l.toFixed(1)+'%;width:'+w.toFixed(1)+'%"></i></div></div></div>'}).join('');
    app.innerHTML='<div class="brand">집지니 · 시공 공정표</div><h1>'+esc(d.name||'')+' 고객님 공정표</h1><div class="meta">'+(d.area?esc(d.area)+' · ':'')+md(d.start)+' ~ '+md(d.end)+'<br>마지막 반영 '+esc(d.updated||'')+'</div>'+
      '<div class="sum"><div><span>지금</span><b>'+headline+'</b></div><div><span>공정률</span><b>'+pct+'%</b></div><div><span>완료 공정</span><b>'+doneN+' / '+ph.length+'</b></div><div><span>전체 기간</span><b>'+total+'일</b></div></div><div class="prog" title="계획 '+plan+'%"><i style="width:'+pct+'%"></i><em style="left:'+plan+'%"></em></div><div class="pmeta">공정률 '+pct+'% · 오늘 계획 '+plan+'%'+(d.start<=today&&pct+10<plan?' · 일정보다 늦어지고 있습니다':'')+'</div>'+
      '<div class="card">'+rows+'</div>'+
      // 2026-10-06 대금 지급 일정 (일괄 수납 현장)
      ((d.pay&&d.pay.length)?(function(){var tot=0;var h='<div class="card pay"><h2>💰 공사 대금 지급 일정</h2>'+d.pay.map(function(x){tot+=Math.round(x.amount/1.1);var late=!x.done&&x.due&&x.due<today;return '<div class="pr'+(x.done?' ok':late?' late':'')+'"><div class="pd">'+x.no+'회<br><small>'+(x.due?md(x.due)+'까지':'일정 확정 후')+'</small></div><div class="pw"><b>'+esc(x.when)+'</b><span class="ps">'+(x.done?'입금 완료':late?'기한 지남':'예정')+'</span></div><div class="pa">'+Math.round(x.amount/1.1).toLocaleString('ko-KR')+'원</div></div>'}).join('');
        return h+'<div class="ptot"><span>공사 금액 합계 (부가가치세 별도)</span><b>'+tot.toLocaleString('ko-KR')+'원</b></div><div class="pnote">※ 부가가치세액 10%는 별도입니다. 각 회차 금액에 10%를 더해 집지니 계좌로 입금해 주세요. 자재상·기술자 지급은 집지니가 맡습니다.</div></div>'})():'')+
      '<div class="share"><button class="kk" onclick="shareIt()">카카오톡으로 보내기</button><button onclick="copyIt()">링크 복사</button><button onclick="window.print()">인쇄</button></div>'+
      '<a class="cta" href="'+esc(d.kakao||'https://pf.kakao.com/_NjpxhC/chat')+'">일정 문의 · 카톡 상담</a>'+
      '<div class="note">· 공정마다 시작 전날 준비사항을 따로 안내드립니다.<br>· 현장 사정으로 일정이 바뀌면 이 링크에 바로 반영되고, 바뀐 내용은 따로 알려 드립니다.<br>· 소음 작업은 평일 오전 9시 ~ 오후 6시에만 진행합니다.</div>'+
      '<div class="foot">집지니 · 코디 '+esc(d.codiPhone||'')+' · 카카오톡 @집지니</div>';
    document.title='집지니 · '+(d.name||'')+' 고객님 공정표';
  }
  window.shareIt=function(){
    var data={title:document.title,text:document.title+' — 공정별 일정 확인',url:location.href};
    if(navigator.share){navigator.share(data).catch(function(){});return}
    copyIt();toast('링크를 복사했습니다 — 카카오톡 대화창에 붙여 넣어 주세요');
  };
  window.copyIt=function(){
    var u=location.href;
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(u).then(function(){toast('링크를 복사했습니다')},function(){prompt('아래 링크를 복사해 주세요',u)});}
    else prompt('아래 링크를 복사해 주세요',u);
  };
  // 시험 문자(W-TEST)·예시(DEMO) 링크는 예시 공정표로
  if(/^(W-TEST|DEMO)$/i.test(id)){var t0=new Date();var ad=function(n){var x=new Date(t0.getTime()+n*864e5);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')+'-'+String(x.getDate()).padStart(2,'0')};
    render({ok:true,name:'예*고객',area:'예시 현장',start:ad(-3),end:ad(30),updated:'예시 화면 — 실제 공정표가 아닙니다',codiPhone:'010-9806-0422',phases:[{label:'사전준비',trades:'관리사무소 신고·보양',start:ad(-3),end:ad(-3),status:'완료'},{label:'철거',trades:'철거공사',start:ad(-2),end:ad(0),status:'진행중',worker:'김**'},{label:'설비·전기·창호',trades:'수전·배관, 조명공사, 창호공사',start:ad(3),end:ad(9),status:'예정'},{label:'목공',trades:'목공공사',start:ad(10),end:ad(16),status:'예정'},{label:'타일·도장',trades:'타일공사, 도장공사',start:ad(17),end:ad(23),status:'예정'},{label:'도배·바닥',trades:'도배공사, 바닥공사',start:ad(24),end:ad(28),status:'예정'},{label:'가구·마감',trades:'싱크·가구',start:ad(29),end:ad(30),status:'예정'}]});return}
  // 웹앱이 처음 깨어날 때 느릴 수 있어 한 번 더 시도
  function load(n){
    var ctl=window.AbortController?new AbortController():null, tm=setTimeout(function(){if(ctl)ctl.abort()},15000);
    fetch(API+'?w='+encodeURIComponent(id),{redirect:'follow',signal:ctl?ctl.signal:undefined}).then(function(r){return r.text()}).then(function(t){clearTimeout(tm);var j=null;try{j=JSON.parse(t)}catch(e){}
      if(j&&j.ok&&j.phases&&j.phases.length)render(j);else if(j&&(j.err==='not found'||j.err==='bad id'))fail('none');else if(n<1)load(n+1);else fail('net')})
    .catch(function(){clearTimeout(tm);if(n<1)load(n+1);else fail('net')});
  }
  load(0);
})();
</script>
</body>
</html>
