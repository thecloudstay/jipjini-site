<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f5e46">
<title>공사 진행 현황 | 집지니</title>
<style>
:root{--g:#1f5e46;--g2:#2c7a5c;--gl:#e6efe9;--bg:#fbf8f1;--card:#fff;--ink:#22262a;--mute:#6f7479;--line:#e7e1d4;--warn:#b5562b;--warnl:#f8e7dc;--wait:#8a8f94;--waitl:#eeeeec}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.2px;line-height:1.55;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:var(--g);color:#fff;padding:22px 16px 26px}
header .in{max-width:560px;margin:0 auto}
.brand{font-weight:800;letter-spacing:3px;font-size:14px;opacity:.9}
header h1{font-size:22px;font-weight:800;margin-top:8px}
header .who{margin-top:6px;font-size:14px;opacity:.92}
header .site{font-size:13px;opacity:.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px}
.card h2{font-size:16px;font-weight:800;color:var(--g);margin-bottom:12px}
.top{margin-top:-14px}
.pct{display:flex;align-items:baseline;justify-content:space-between}
.pct b{font-size:34px;color:var(--g);font-weight:800}
.pct span{font-size:13px;color:var(--mute)}
.bar{height:12px;background:var(--gl);border-radius:8px;overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;background:var(--g);border-radius:8px;width:0;transition:width .8s ease}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.meta em{font-style:normal;color:var(--ink);font-weight:600}
.stage{display:inline-block;margin-top:10px;background:var(--gl);color:var(--g);font-weight:700;font-size:13px;padding:4px 10px;border-radius:20px}
.next{display:flex;gap:12px;align-items:center}
.next .d{flex:0 0 auto;background:var(--g);color:#fff;border-radius:10px;padding:8px 10px;text-align:center;min-width:64px}
.next .d b{display:block;font-size:20px;line-height:1.1}
.next .d small{font-size:11px;opacity:.85}
.next .t b{font-size:16px}
.next .t p{font-size:13px;color:var(--mute)}
ol.ph{list-style:none}
ol.ph li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ol.ph li:first-child{border-top:0}
.no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--waitl);color:var(--wait);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ph .nm{flex:1;min-width:0}
.ph .nm b{display:block;font-size:15px}
.ph .nm small{color:var(--mute);font-size:12px}
.bd{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.s-done .no{background:var(--g);color:#fff}.s-done .bd{background:var(--gl);color:var(--g)}
.s-now .no{background:#fff;border:2px solid var(--g);color:var(--g)}.s-now .bd{background:var(--g);color:#fff}
.s-late .no{background:var(--warnl);color:var(--warn)}.s-late .bd{background:var(--warnl);color:var(--warn)}
.s-wait .bd{background:var(--waitl);color:var(--wait)}
.log{border-top:1px solid var(--line);padding:12px 0}
.log:first-of-type{border-top:0;padding-top:0}
.log .dt{font-weight:800;font-size:14px;color:var(--g)}
.log dl{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;margin-top:6px;font-size:14px}
.log dt{color:var(--mute);font-size:13px}
.log dd{white-space:pre-wrap;word-break:break-word}
.grp{margin-top:6px}
.grp+.grp{margin-top:16px}
.grp h3{font-size:14px;font-weight:700;margin-bottom:8px}
.grp h3 small{color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{border:0;padding:0;background:var(--waitl);aspect-ratio:1/1;border-radius:8px;overflow:hidden;cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
.sum div{background:var(--bg);border-radius:10px;padding:10px 4px}
.sum small{display:block;font-size:12px;color:var(--mute)}
.sum b{font-size:15px}
.sum .rest b{color:var(--warn)}
table.pay{width:100%;border-collapse:collapse;font-size:13.5px}
table.pay td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
table.pay td.r{text-align:right;white-space:nowrap}
table.pay small{display:block;color:var(--mute);font-size:12px}
.vat{margin-top:10px;font-size:12px;color:var(--mute)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--g);color:var(--g);background:#fff}
.btn.pri{background:var(--g);color:#fff}
.btn svg{width:18px;height:18px}
.btns.one{grid-template-columns:1fr}
.empty{color:var(--mute);font-size:14px}
.state{text-align:center;padding:70px 10px;color:var(--mute)}
.state b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.spin{width:34px;height:34px;border:3px solid var(--gl);border-top-color:var(--g);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:12px;color:var(--mute);margin-top:26px;line-height:1.7}
#lb{position:fixed;inset:0;background:rgba(10,14,12,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;border-radius:6px}
#lb p{color:#fff;font-size:14px;margin-top:10px;text-align:center}
#lb .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:50%;font-size:22px;cursor:pointer}
#lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:26px;cursor:pointer;border-radius:8px}
#lb .pv{left:8px}#lb .nx{right:8px}
.hide{display:none}
</style>
</head>
<body>
<header><div class="in">
  <div class="brand">집지니</div>
  <h1>공사 진행 현황</h1>
  <div class="who" id="who"></div>
  <div class="site" id="site"></div>
</div></header>
<main class="wrap" id="app">
  <div class="state"><div class="spin"></div><b>불러오는 중입니다</b>잠시만 기다려 주세요.</div>
</main>
<div id="lb" role="dialog" aria-label="사진 크게 보기">
  <button class="x" type="button" aria-label="닫기">&times;</button>
  <button class="nv pv" type="button" aria-label="이전 사진">&#8249;</button>
  <img alt="">
  <p></p>
  <button class="nv nx" type="button" aria-label="다음 사진">&#8250;</button>
</div>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec';
  var KAKAO_URL = 'https://pf.kakao.com/_NjpxhC/chat';
  var REFRESH_MS = 5 * 60 * 1000;
  var app = document.getElementById('app');
  var k = (new URLSearchParams(location.search).get('k') || '').trim();
  var photos = [], lbIdx = 0, loadedOnce = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  function md(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); if (!m) return esc(s || ''); var d = new Date(+m[1], +m[2] - 1, +m[3]); return (+m[2]) + '월 ' + (+m[3]) + '일(' + DOW[d.getDay()] + ')'; }
  function range(a, b) { return a && b && a !== b ? md(a) + ' ~ ' + md(b) : md(a || b); }
  function safeUrl(u) { u = String(u || ''); return /^https:\/\//.test(u) ? u : ''; }

  function state(title, msg) { app.innerHTML = '<div class="state"><b>' + esc(title) + '</b>' + esc(msg) + '</div>'; }

  var ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  var ICON_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.4-4.2A8 8 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>';

  var CLS = { '완료': 's-done', '진행 중': 's-now', '지연': 's-late', '예정': 's-wait' };

  function render(d) {
    document.getElementById('who').textContent = (d.고객 || '고객') + ' 고객님 댁';
    document.getElementById('site').textContent = d.현장 || '';
    var h = [];
    var pct = Math.max(0, Math.min(100, Number(d.진행률) || 0));
    var phases = d.공정 || [];
    var doneN = phases.filter(function (p) { return p.상태 === '완료'; }).length;

    // 진행률
    h.push('<section class="card top"><h2>전체 진행률</h2><div class="pct"><b>' + pct + '%</b><span>' + (phases.length ? '공정 ' + phases.length + '개 중 ' + doneN + '개 완료' : '') + '</span></div>' +
      '<div class="bar"><i id="barfill"></i></div><div class="meta">' +
      (d.착공일 ? '<span>착공 <em>' + md(d.착공일) + '</em></span>' : '') +
      (d.완공예정일 ? '<span>완공 예정 <em>' + md(d.완공예정일) + '</em></span>' : '') + '</div>' +
      (d.단계 ? '<span class="stage">지금 단계 · ' + esc(d.단계) + '</span>' : '') + '</section>');

    // 다음 일정
    var now = phases.filter(function (p) { return p.상태 === '진행 중'; })[0];
    if (d.다음 || now) {
      h.push('<section class="card"><h2>다음 일정</h2>');
      if (now) h.push('<div class="next" style="margin-bottom:' + (d.다음 ? '12px' : '0') + '"><div class="d" style="background:var(--g2)"><small>지금</small><b>진행</b></div><div class="t"><b>' + esc(now.단계명) + '</b><p>' + range(now.시작, now.종료) + '</p></div></div>');
      if (d.다음) { var m = /^\d{4}-(\d{2})-(\d{2})/.exec(d.다음.시작 || ''); h.push('<div class="next"><div class="d"><small>' + (m ? (+m[1]) + '월' : '예정') + '</small><b>' + (m ? (+m[2]) : '-') + '</b></div><div class="t"><b>' + esc(d.다음.단계명) + '</b><p>' + (d.다음.시작 ? md(d.다음.시작) + ' 시작 예정' : '날짜 정해지는 대로 알려 드려요') + '</p></div></div>'); }
      h.push('</section>');
    }

    // 공정 목록
    h.push('<section class="card"><h2>공정</h2>');
    if (!phases.length) h.push('<p class="empty">공정표가 확정되면 이곳에 단계별 일정이 보입니다.</p>');
    else {
      h.push('<ol class="ph">');
      phases.forEach(function (p, i) { h.push('<li class="' + (CLS[p.상태] || 's-wait') + '"><span class="no">' + (i + 1) + '</span><span class="nm"><b>' + esc(p.단계명) + '</b><small>' + range(p.시작, p.종료) + '</small></span><span class="bd">' + esc(p.상태 || '예정') + '</span></li>'); });
      h.push('</ol>');
    }
    h.push('</section>');

    // 현장 일보
    var logs = d.일보 || [];
    if (logs.length) {
      h.push('<section class="card"><h2>현장 일보</h2>');
      logs.forEach(function (x) {
        h.push('<div class="log"><div class="dt">' + md(x.날짜) + '</div><dl>' +
          (x.오늘한일 ? '<dt>오늘 한 일</dt><dd>' + esc(x.오늘한일) + '</dd>' : '') +
          (x.내일할일 ? '<dt>내일 할 일</dt><dd>' + esc(x.내일할일) + '</dd>' : '') +
          (x.특이사항 ? '<dt>특이사항</dt><dd>' + esc(x.특이사항) + '</dd>' : '') + '</dl></div>');
      });
      h.push('</section>');
    }

    // 현장 사진 (단계별)
    photos = (d.사진 || []).filter(function (p) { return safeUrl(p.썸네일); });
    if (photos.length) {
      var order = [], groups = {};
      photos.forEach(function (p, i) { var s = p.단계 || '기타'; if (!groups[s]) { groups[s] = []; order.push(s); } groups[s].push(i); });
      h.push('<section class="card"><h2>현장 사진</h2>');
      order.forEach(function (s) {
        h.push('<div class="grp"><h3>' + esc(s) + ' <small>' + groups[s].length + '장</small></h3><div class="grid">');
        groups[s].forEach(function (i) { var p = photos[i]; h.push('<button type="button" data-i="' + i + '" aria-label="' + esc((p.설명 || s) + ' 크게 보기') + '"><img loading="lazy" referrerpolicy="no-referrer" src="' + esc(safeUrl(p.썸네일)) + '" alt="' + esc(p.설명 || s) + '"></button>'); });
        h.push('</div></div>');
      });
      h.push('</section>');
    }

    // 입금 현황
    var pay = d.입금;
    if (pay && pay.줄 && pay.줄.length) {
      h.push('<section class="card"><h2>입금 현황</h2><div class="sum"><div><small>약정</small><b>' + won(pay.약정) + '</b></div><div><small>입금</small><b>' + won(pay.입금) + '</b></div><div class="rest"><small>남은 금액</small><b>' + won(pay.잔액) + '</b></div></div><table class="pay">');
      pay.줄.forEach(function (x) { h.push('<tr><td>' + esc(x.내용 || '코디비') + (x.기한 && x.상태 !== '완납' ? '<small>입금 기한 ' + md(x.기한) + '</small>' : '') + '</td><td class="r">' + won(x.약정액) + '<small>' + esc(x.상태 || '') + '</small></td></tr>'); });
      h.push('</table>' + (pay.다음기한 ? '<p class="vat">다음 입금 기한: ' + md(pay.다음기한) + '</p>' : '') + '<p class="vat">부가세 10% 별도 · 자재비·시공비는 각 업체에 직접 입금하시는 금액이라 여기에 포함되지 않습니다.</p></section>');
    }

    // 연락처
    var tel = String(d.연락처 || '').replace(/[^\d+]/g, '');
    var kakao = safeUrl(d.카톡주소) || KAKAO_URL;
    h.push('<section class="card"><h2>담당 코디에게 문의</h2><div class="btns' + (tel ? '' : ' one') + '">' +
      (tel ? '<a class="btn" href="tel:' + esc(tel) + '">' + ICON_PHONE + '전화하기</a>' : '') +
      '<a class="btn pri" href="' + esc(kakao) + '" target="_blank" rel="noopener">' + ICON_CHAT + '카톡 상담' + '</a></div>' +
      (d.카톡 ? '<p class="vat" style="text-align:center">카카오톡 채널 ' + esc(d.카톡) + '</p>' : '') + '</section>');

    h.push('<footer>집지니 · 인테리어 코디네이터<br>' + (d.갱신 ? esc(d.갱신) + ' 기준 · ' : '') + '5분마다 새로 고칩니다<br>이 링크는 고객님 전용입니다. 다른 분께 전달하지 말아 주세요.</footer>');
    app.innerHTML = h.join('');
    requestAnimationFrame(function () { var b = document.getElementById('barfill'); if (b) b.style.width = pct + '%'; });
  }

  // 사진 크게 보기
  var lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbTxt = lb.querySelector('p');
  function lbShow(i) {
    if (!photos.length) return;
    lbIdx = (i + photos.length) % photos.length; var p = photos[lbIdx];
    lbImg.src = safeUrl(p.큰사진) || safeUrl(p.썸네일);
    lbTxt.textContent = [p.단계, p.촬영일 ? md(p.촬영일).replace(/&[^;]+;/g, '') : '', p.설명].filter(Boolean).join(' · ') + '  (' + (lbIdx + 1) + '/' + photos.length + ')';
    lb.classList.add('on');
  }
  function lbClose() { lb.classList.remove('on'); lbImg.removeAttribute('src'); }
  app.addEventListener('click', function (e) { var b = e.target.closest('[data-i]'); if (b) lbShow(Number(b.getAttribute('data-i'))); });
  lb.querySelector('.x').addEventListener('click', lbClose);
  lb.querySelector('.pv').addEventListener('click', function (e) { e.stopPropagation(); lbShow(lbIdx - 1); });
  lb.querySelector('.nx').addEventListener('click', function (e) { e.stopPropagation(); lbShow(lbIdx + 1); });
  lb.addEventListener('click', function (e) { if (e.target === lb) lbClose(); });
  document.addEventListener('keydown', function (e) { if (!lb.classList.contains('on')) return; if (e.key === 'Escape') lbClose(); else if (e.key === 'ArrowLeft') lbShow(lbIdx - 1); else if (e.key === 'ArrowRight') lbShow(lbIdx + 1); });
  var tx = 0; lb.addEventListener('touchstart', function (e) { tx = e.touches[0].clientX; }, { passive: true });
  lb.addEventListener('touchend', function (e) { var dx = e.changedTouches[0].clientX - tx; if (Math.abs(dx) > 50) lbShow(lbIdx + (dx < 0 ? 1 : -1)); }, { passive: true });

  function load() {
    if (!/^[A-Za-z0-9_-]{12,64}$/.test(k)) { state('링크가 올바르지 않습니다', '받으신 문자의 링크를 다시 눌러 주시거나 담당 코디에게 문의해 주세요.'); return; }
    fetch(EXEC + '?type=progress&k=' + encodeURIComponent(k), { redirect: 'follow', cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (j && j.ok) { loadedOnce = true; render(j); return; }
        if (loadedOnce) return;   // 새로 고침 실패는 지금 화면을 그대로 둔다
        var msg = (j && j.err) || '';
        if (/링크/.test(msg)) state('링크가 올바르지 않습니다', '받으신 문자의 링크를 다시 눌러 주시거나 담당 코디에게 문의해 주세요.');
        else state('정보를 불러오지 못했습니다', msg || '잠시 뒤 다시 열어 주세요.');
      })
      .catch(function () { if (!loadedOnce) state('연결이 원활하지 않습니다', '잠시 뒤 다시 열어 주세요.'); });
  }
  load();
  setInterval(function () { if (!document.hidden && !lb.classList.contains('on')) load(); }, REFRESH_MS);
})();
</script>
</body>
</html>
