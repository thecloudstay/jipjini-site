<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">

<meta name="theme-color" content="#1f5e46">
<title>우리 집 공사 한눈에 | 집지니</title>
<style>
:root{--g:#1f5e46;--g2:#2c7a5c;--gl:#e6efe9;--bg:#fbf8f1;--card:#fff;--ink:#22262a;--mute:#6f7479;--line:#e7e1d4;--warn:#b5562b;--warnl:#f8e7dc;--wait:#8a8f94;--waitl:#eeeeec}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.2px;line-height:1.55;font-size:15px}
.wrap{max-width:560px;margin:0 auto;padding:0 16px 40px}
header{background:var(--g);color:#fff;padding:22px 16px 26px}
header .in{max-width:560px;margin:0 auto}
.brand{font-weight:800;letter-spacing:3px;font-size:14px;opacity:.9}
header h1{font-size:22px;font-weight:800;margin-top:8px}
header .who{margin-top:6px;font-size:14px;opacity:.92}
header .site{font-size:13px;opacity:.8}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px 16px;margin-top:14px}
.card h2{font-size:16px;font-weight:800;color:var(--g);margin-bottom:12px}
.top{margin-top:-14px}
.pct{display:flex;align-items:baseline;justify-content:space-between}
.pct b{font-size:34px;color:var(--g);font-weight:800}
.pct span{font-size:13px;color:var(--mute)}
.bar{height:12px;background:var(--gl);border-radius:8px;overflow:hidden;margin:8px 0 10px}
.bar i{display:block;height:100%;background:var(--g);border-radius:8px;width:0;transition:width .8s ease}
.meta{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13px;color:var(--mute)}
.meta em{font-style:normal;color:var(--ink);font-weight:600}
.stage{display:inline-block;margin-top:10px;background:var(--gl);color:var(--g);font-weight:700;font-size:13px;padding:4px 10px;border-radius:20px}
.next{display:flex;gap:12px;align-items:center}
.next .d{flex:0 0 auto;background:var(--g);color:#fff;border-radius:10px;padding:8px 10px;text-align:center;min-width:64px}
.next .d b{display:block;font-size:20px;line-height:1.1}
.next .d small{font-size:11px;opacity:.85}
.next .t b{font-size:16px}
.next .t p{font-size:13px;color:var(--mute)}
ol.ph{list-style:none}
ol.ph li{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
ol.ph li:first-child{border-top:0}
.no{flex:0 0 26px;height:26px;border-radius:50%;background:var(--waitl);color:var(--wait);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center}
.ph .nm{flex:1;min-width:0}
.ph .nm b{display:block;font-size:15px}
.ph .nm small{color:var(--mute);font-size:12px}
.bd{flex:0 0 auto;font-size:12px;font-weight:700;padding:3px 9px;border-radius:20px;white-space:nowrap}
.s-done .no{background:var(--g);color:#fff}.s-done .bd{background:var(--gl);color:var(--g)}
.s-now .no{background:#fff;border:2px solid var(--g);color:var(--g)}.s-now .bd{background:var(--g);color:#fff}
.s-late .no{background:var(--warnl);color:var(--warn)}.s-late .bd{background:var(--warnl);color:var(--warn)}
.s-wait .bd{background:var(--waitl);color:var(--wait)}
.log{border-top:1px solid var(--line);padding:12px 0}
.log:first-of-type{border-top:0;padding-top:0}
.log .dt{font-weight:800;font-size:14px;color:var(--g)}
.log dl{display:grid;grid-template-columns:62px 1fr;gap:4px 8px;margin-top:6px;font-size:14px}
.log dt{color:var(--mute);font-size:13px}
.log dd{white-space:pre-wrap;word-break:break-word}
.grp{margin-top:6px}
.grp+.grp{margin-top:16px}
.grp h3{font-size:14px;font-weight:700;margin-bottom:8px}
.grp h3 small{color:var(--mute);font-weight:400}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.grid button{border:0;padding:0;background:var(--waitl);aspect-ratio:1/1;border-radius:8px;overflow:hidden;cursor:pointer}
.grid img{width:100%;height:100%;object-fit:cover;display:block}
.sum{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;text-align:center;margin-bottom:12px}
.sum div{background:var(--bg);border-radius:10px;padding:10px 4px}
.sum small{display:block;font-size:12px;color:var(--mute)}
.sum b{font-size:15px}
.sum .rest b{color:var(--warn)}
table.pay{width:100%;border-collapse:collapse;font-size:13.5px}
table.pay td{padding:8px 0;border-top:1px solid var(--line);vertical-align:top}
table.pay td.r{text-align:right;white-space:nowrap}
table.pay small{display:block;color:var(--mute);font-size:12px}
.vat{margin-top:10px;font-size:12px;color:var(--mute)}
.btns{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:50px;border-radius:12px;font-weight:700;font-size:15px;text-decoration:none;border:1.5px solid var(--g);color:var(--g);background:#fff}
.btn.pri{background:var(--g);color:#fff}
.btn svg{width:18px;height:18px}
.btns.one{grid-template-columns:1fr}
.empty{color:var(--mute);font-size:14px}
.state{text-align:center;padding:70px 10px;color:var(--mute)}
.state b{display:block;color:var(--ink);font-size:17px;margin-bottom:6px}
.spin{width:34px;height:34px;border:3px solid var(--gl);border-top-color:var(--g);border-radius:50%;margin:0 auto 14px;animation:sp 1s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
footer{text-align:center;font-size:12px;color:var(--mute);margin-top:26px;line-height:1.7}
#lb{position:fixed;inset:0;background:rgba(10,14,12,.92);display:none;flex-direction:column;align-items:center;justify-content:center;z-index:50;padding:16px}
#lb.on{display:flex}
#lb img{max-width:100%;max-height:78vh;border-radius:6px}
#lb p{color:#fff;font-size:14px;margin-top:10px;text-align:center}
#lb .x{position:absolute;top:12px;right:12px;width:44px;height:44px;border:0;background:rgba(255,255,255,.12);color:#fff;border-radius:50%;font-size:22px;cursor:pointer}
#lb .nv{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:64px;border:0;background:rgba(255,255,255,.1);color:#fff;font-size:26px;cursor:pointer;border-radius:8px}
#lb .pv{left:8px}#lb .nx{right:8px}
.hide{display:none}
.chain{list-style:none;position:relative}
.chain li{position:relative;display:flex;gap:12px;padding:0 0 14px}
.chain li:last-child{padding-bottom:0}
.chain li:before{content:"";position:absolute;left:12px;top:26px;bottom:0;width:2px;background:var(--line)}
.chain li:last-child:before{display:none}
.chain li.c-done:before{background:var(--g)}
.chain .dot{flex:0 0 26px;height:26px;border-radius:50%;background:var(--waitl);color:var(--wait);font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;position:relative;z-index:1}
.chain .c-done .dot,.c-done .dot{background:var(--g);color:#fff}
.c-now .dot{background:#fff;border:2.5px solid var(--g);color:var(--g);box-shadow:0 0 0 4px var(--gl)}
.c-next .dot{background:#fff;border:2px dashed var(--g2);color:var(--g2)}
.chain .tx{flex:1;min-width:0;padding-top:2px}
.chain .tx b{font-size:15px}
.chain .tx .dt{font-size:12px;color:var(--mute);margin-left:6px}
.chain .tx p{font-size:13px;color:var(--mute);margin-top:2px}
.c-now .tx{background:var(--gl);border-radius:10px;padding:8px 10px;margin-top:-4px}
.c-now .tx p{color:var(--ink)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:12px;margin-left:6px;vertical-align:1px}
.tag.now{background:var(--g);color:#fff}.tag.nx{background:#fff;border:1px solid var(--g2);color:var(--g2)}
.c-todo .tx b{color:var(--mute);font-weight:600}
.hero{display:flex;gap:10px;margin-bottom:14px}
.hero div{flex:1;background:var(--bg);border-radius:10px;padding:10px 12px}
.hero small{display:block;font-size:12px;color:var(--mute)}
.hero b{font-size:15px;color:var(--g)}
.docs{display:grid;gap:8px}
.doc{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px;background:#fff;text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.doc[disabled]{cursor:default;background:var(--bg)}
.doc .ic{flex:0 0 38px;height:38px;border-radius:10px;background:var(--gl);color:var(--g);display:flex;align-items:center;justify-content:center}
.doc[disabled] .ic{background:var(--waitl);color:var(--wait)}
.doc .ic svg{width:20px;height:20px}
.doc .tt{flex:1;min-width:0}
.doc .tt b{display:block;font-size:14.5px}
.doc .tt small{font-size:12.5px;color:var(--mute)}
.doc .go{flex:0 0 auto;font-size:13px;font-weight:700;color:var(--g)}
.doc[disabled] .go{color:var(--wait);font-weight:500}
details.sample{border:1px solid var(--line);border-radius:12px;padding:0 12px;margin-top:8px;background:#fff}
details.sample summary{padding:12px 0;font-weight:700;font-size:14px;cursor:pointer;color:var(--g)}
details.sample dl{padding-bottom:12px}
details.sample dt{font-weight:700;font-size:13.5px;margin-top:8px}
details.sample dd{font-size:13px;color:var(--mute)}
.pp{border-top:1px solid var(--line);padding:12px 0}
.pp:first-of-type{border-top:0;padding-top:0}
.pp .hd{display:flex;align-items:center;gap:10px}
.pp .hd .nm{flex:1;min-width:0}
.pp .hd b{font-size:15px}
.pp .hd small{display:block;color:var(--mute);font-size:12px}
.pp .who{font-size:13px;margin-top:6px}
.pp .who span{display:inline-block;background:var(--bg);border-radius:12px;padding:2px 9px;margin:2px 4px 0 0}
.pp details{margin-top:6px}
.pp summary{font-size:13px;color:var(--g);font-weight:700;cursor:pointer}
.pp .prep{white-space:pre-wrap;font-size:13px;background:var(--bg);border-radius:10px;padding:10px;margin-top:6px}
.s-now.pp .hd b{color:var(--g)}
.f label{display:block;font-size:13px;font-weight:700;margin:10px 0 4px}
.f select,.f textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:10px;font:inherit;font-size:15px;background:#fff}
.f textarea{min-height:110px;resize:vertical}
.f .btn{width:100%;margin-top:12px;cursor:pointer}
.f .msg{font-size:13px;margin-top:8px;text-align:center}
.asl{margin-top:14px;border-top:1px dashed var(--line);padding-top:10px}
.asl div{font-size:13px;padding:6px 0;border-top:1px solid var(--line)}
.asl div:first-of-type{border-top:0}
.asl b{font-size:12px;color:var(--g);margin-right:6px}
.pvbar{background:#fff4d6;color:#6b4e00;font-size:13px;text-align:center;padding:8px 12px;font-weight:600}
</style>

<header><div class="in">

</main>
<div id="lb" role="dialog" aria-label="사진 크게 보기">

<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec';
  var KAKAO_URL = 'https://pf.kakao.com/_NjpxhC/chat';
  var REFRESH_MS = 5 * 60 * 1000;
  var app = document.getElementById('app');
  var k = (new URLSearchParams(location.search).get('k') || '').trim();
  var photos = [], lbIdx = 0, loadedOnce = false;

  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function won(n) { return (Number(n) || 0).toLocaleString('ko-KR') + '원'; }
  var DOW = ['일', '월', '화', '수', '목', '금', '토'];
  function md(s) { var m = /^(\d{4})-(\d{2})-(\d{2})/.exec(String(s || '')); if (!m) return esc(s || ''); var d = new Date(+m[1], +m[2] - 1, +m[3]); return (+m[2]) + '월 ' + (+m[3]) + '일(' + DOW[d.getDay()] + ')'; }
  function range(a, b) { return a && b && a !== b ? md(a) + ' ~ ' + md(b) : md(a || b); }
  function safeUrl(u) { u = String(u || ''); return /^https:\/\//.test(u) ? u : ''; }

  function state(title, msg) { app.innerHTML = '<div class="state"><b>' + esc(title) + '</b>' + esc(msg) + '</div>'; }

  var ICON_PHONE = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg>';
  var ICON_CHAT = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.4 8.4 0 0 1-9 8.4 9 9 0 0 1-3.9-.9L3 20.5l1.4-4.2A8 8 0 0 1 3 11.5 8.4 8.4 0 0 1 12 3a8.4 8.4 0 0 1 9 8.5z"/></svg>';

  var CLS = { '완료': 's-done', '진행 중': 's-now', '지연': 's-late', '예정': 's-wait' };
  var PV = /[?&]pv=1/.test(location.search);
  function ico(p) { return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + p + '</svg>'; }
  var DOC_ICO = {
    request: ico('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M8 13h8M8 17h5"/>'),
    biz: ico('<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 9h10M7 13h6M15 16h2"/>'),
    quote: ico('<path d="M9 7h6M9 11h6M9 15h3"/><rect x="4" y="3" width="16" height="18" rx="2"/>'),
    measure: ico('<path d="M3 17 17 3l4 4L7 21H3z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/>'),
    contract: ico('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="m8 16 2 2 5-5"/>'),
    schedule: ico('<rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18"/>')
  };
  var CCLS = { '끝남': 'c-done', '지금': 'c-now', '다음': 'c-next', '앞으로': 'c-todo' };
  function chainHtml(ch) {
    var h = ['<section class="card top"><h2>지금 어디까지 왔나요</h2><div class="hero"><div><small>지금 단계</small><b>' + esc(ch.지금 || '-') + '</b></div><div><small>다음 단계</small><b>' + esc(ch.다음 || '마무리') + '</b></div></div><ol class="chain">'];
    (ch.단계 || []).forEach(function (s, i) {
      var c = CCLS[s.상태] || 'c-todo';
      h.push('<li class="' + c + '"><span class="dot">' + (s.상태 === '끝남' ? '&#10003;' : (i + 1)) + '</span><div class="tx"><b>' + esc(s.이름) + '</b>' +
        (s.상태 === '지금' ? '<span class="tag now">지금</span>' : s.상태 === '다음' ? '<span class="tag nx">다음</span>' : '') +
        (s.날짜 ? '<span class="dt">' + esc(s.날짜).replace(/\d{4}-\d{2}-\d{2}/g, function (x) { return md(x); }) + '</span>' : '') +
        (s.상태 === '지금' || s.상태 === '다음' ? '<p>' + esc(s.설명) + '</p>' : '') + '</div></li>');
    });
    h.push('</ol></section>');
    return h.join('');
  }
  function docsHtml(P) {
    var h = ['<section class="card"><h2>내 서류함</h2><div class="docs">'];
    (P.서류 || []).forEach(function (d) {
      h.push('<button type="button" class="doc" data-doc="' + esc(d.키) + '"' + (d.있음 && !(d.키 === 'contract' && d.예시) ? '' : ' disabled') + '><span class="ic">' + (DOC_ICO[d.키] || DOC_ICO.request) + '</span><span class="tt"><b>' + esc(d.이름) + '</b><small>' + esc(d.설명) + '</small></span><span class="go">' + (d.있음 && !(d.키 === 'contract' && d.예시) ? '열기' : (d.키 === 'contract' ? '아래 참고' : '준비 중')) + '</span></button>');
    });
    h.push('</div>');
    var cs = P.계약요약;
    if (cs) h.push('<p class="vat">계약 ' + (cs.계약일 ? md(cs.계약일) : '') + (cs.착공 ? ' · 착공 ' + md(cs.착공) : '') + (cs.완공 ? ' · 완공 예정 ' + md(cs.완공) : '') + (cs.서명 ? ' · 서명 ' + esc(cs.서명) : '') + '</p>');
    if ((P.계약예시 || []).length) {
      h.push('<details class="sample"' + (cs ? '' : ' open') + '><summary>' + (cs ? '계약 주요 조항 다시 보기' : '계약서에 들어가는 주요 조항 (미리 보기)') + '</summary><dl>');
      P.계약예시.forEach(function (x) { h.push('<dt>' + esc(x.제목) + '</dt><dd>' + esc(x.내용) + '</dd>'); });
      h.push('</dl></details>');
    }
    h.push('<p class="vat">입금은 반드시 사업자등록증과 같은 이름의 집지니 계좌로만 해 주세요. 다른 계좌 안내를 받으시면 입금 전에 코디에게 꼭 확인해 주세요.</p></section>');
    return h.join('');
  }
  function buildHtml(list) {
    var h = ['<section class="card"><h2>시공 단계 · 담당 기술자 · 준비사항</h2>'];
    list.forEach(function (p, i) {
      var c = p.상태 === '완료' ? 's-done' : p.상태 === '진행 중' ? 's-now' : p.상태 === '지연' ? 's-late' : 's-wait';
      h.push('<div class="pp ' + c + '"><div class="hd"><span class="no">' + (i + 1) + '</span><span class="nm"><b>' + esc(p.단계명 || p.공종) + '</b><small>' + range(p.시작, p.종료) + (p.공종 && p.공종 !== p.단계명 ? ' · ' + esc(p.공종) : '') + '</small></span><span class="bd">' + esc(p.상태) + '</span></div>' +
        '<div class="who">담당 ' + ((p.기사 || []).length ? p.기사.map(function (w) { return '<span>' + esc(w) + '</span>'; }).join('') : '<span>배정 중 — 시작 전날 알려 드려요</span>') + '</div>' +

        h.push('</ol>');

    if (P) h.push(docsHtml(P));

    // 현장 일보

      h.push('<section class="card"><h2>현장 일보</h2>');

  // 사진 크게 보기
  var lb = document.getElementById('lb'), lbImg = lb.querySelector('img'), lbTxt = lb.querySelector('p');

  app.addEventListener('click', function (e) {

  function load() {

})();
