<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#1f5e46">
<title>정밀 실측 결과 | 집지니</title>
<style>
:root{--g:#1f5e46;--gl:#e6efe9;--bg:#fbf8f1;--card:#fff;--ink:#22262a;--mute:#6f7479;--line:#e7e1d4;--warn:#b5562b;--warnl:#f8e7dc}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:var(--bg)}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Pretendard","Noto Sans KR","Malgun Gothic",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased;letter-spacing:-.2px;line-height:1.55}
.wrap{max-width:600px;margin:0 auto;padding:0 16px 60px}
header{background:var(--g);color:#fff;padding:22px 16px 26px}
header .in{max-width:600px;margin:0 auto}
.brand{font-weight:800;letter-spacing:3px;font-size:14px;opacity:.9}
header h1{font-size:22px;font-weight:800;margin-top:8px}
header p{margin-top:4px;font-size:14px;opacity:.9}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-top:14px}
.card h2{font-size:16px;font-weight:800;color:var(--g);margin-bottom:8px;display:flex;align-items:baseline;gap:8px;flex-wrap:wrap}
.card h2 small{font-size:13px;color:var(--mute);font-weight:500}
.note{background:var(--gl);border-radius:12px;padding:12px 14px;font-size:14px;margin-top:14px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:14px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px;color:var(--g);font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--mute)}
.dim{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:15px}
.dim .k{color:var(--mute)}.dim .v{font-variant-numeric:tabular-nums;font-weight:600}
.items{margin-top:10px;border-top:1px dashed var(--line);padding-top:8px}
.it{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #f1ede4;font-size:14px}
.it:last-child{border-bottom:0}
.it .n{font-weight:700}.it .s{color:var(--mute);font-size:12.5px}
.it .m{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.memo{font-size:13px;color:var(--mute);margin-top:6px;white-space:pre-wrap}
.pic img{width:100%;border:1px solid var(--line);border-radius:10px;background:#fff;margin-top:6px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:700;border-radius:10px;padding:13px 14px;border:1px solid var(--g);background:#fff;color:var(--g);cursor:pointer;width:100%;font-size:16px}
.btn.main{background:var(--g);color:#fff;font-size:17px;padding:15px;margin-top:8px}
.btn:disabled{opacity:.6}
textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border:1px solid var(--line);border-radius:10px;min-height:110px;margin-top:8px}
.msg{margin-top:10px;font-size:14px;color:var(--warn)}
.ok{border-color:var(--g);background:var(--gl)}
.small{font-size:12.5px;color:var(--mute);margin-top:8px}
.sk{height:16px;background:#eee8dc;border-radius:6px;margin:10px 0}
</style>
</head>
<body>
<header><div class="in"><div class="brand">JIPJINI</div><h1>정밀 실측 결과</h1><p id="who">불러오는 중…</p></div></header>
<main class="wrap" id="app"><div class="card"><div class="sk"></div><div class="sk" style="width:70%"></div><div class="sk" style="width:50%"></div></div></main>
<script>
(function () {
  var EXEC = 'https://script.google.com/macros/s/AKfycbzxm4mmZs1yVJPa3T-wb0cdJbEUMPYl6dDKtQNSNmJy4nEsCholrEnPAN8e0JfAtOV99A/exec';
  var k = new URLSearchParams(location.search).get('k') || '', D = null;
  function $(id) { return document.getElementById(id); }
  function esc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  function mm(n) { return n ? Number(n).toLocaleString('ko-KR') : '-'; }
  function m1(n) { return n ? String(Math.round(Number(n)) / 1000) : '-'; }
  function fail(m) { $('who').textContent = ''; $('app').innerHTML = '<div class="card"><p>' + esc(m) + '</p><p class="small">받은 링크를 그대로 눌러 주세요. 안 되면 코디에게 연락 주세요.</p></div>'; }
  if (!k) { fail('링크가 올바르지 않습니다.'); return; }
  fetch(EXEC + '?type=ms&k=' + encodeURIComponent(k), { redirect: 'follow', cache: 'no-store' }).then(function (r) { return r.json(); }).then(function (d) {
    if (!d || d.ok === false) { fail((d && d.err) || '불러오지 못했습니다.'); return; }
    D = d; render();
  }).catch(function () { fail('인터넷 연결을 확인하고 다시 열어 주세요.'); });

  function itemHtml(it) {
    var spec = [it.열림, it.사양, it.색상, it.손잡이 ? '손잡이 ' + it.손잡이 : ''].filter(Boolean).join(' · ');
    var size = it.가로 || it.세로 ? mm(it.가로) + ' × ' + mm(it.세로) + (it.두께 ? ' (두께·문틀 ' + mm(it.두께) + ')' : '') : '';
    return '<div class="it"><div><div class="n">' + esc(it.종류 || '항목') + (it.수량 > 1 ? ' ' + it.수량 + '개' : '') + '</div>' + (spec ? '<div class="s">' + esc(spec) + '</div>' : '') + (it.메모 ? '<div class="s">' + esc(it.메모) + '</div>' : '') + '</div><div class="m">' + esc(size) + '</div></div>';
  }
  function render() {
    $('who').textContent = D.고객명 + ' 고객님 댁' + (D.실측일 ? ' · 실측 ' + D.실측일 : '');
    var t = D.합계 || {}, h = '';
    h += '<div class="note">공간별 치수와 문·창 크기입니다. 공간 크기는 <b>m</b>, 문·창 크기는 <b>mm</b>(1,000mm = 1m)이고, 면적은 ㎡와 평으로 적었습니다. 이 치수로 <b>정밀 견적서</b>를 만듭니다.</div>';
    h += '<div class="stats"><div class="stat"><b>' + (t.공간수 || 0) + '곳</b><span>공간</span></div><div class="stat"><b>' + (t.바닥 || 0) + '㎡</b><span>바닥 합계</span></div><div class="stat"><b>' + (t.평 || 0) + '평</b><span>바닥 평수</span></div></div>';
    (D.그림 || []).forEach(function (p) { h += '<div class="card pic"><h2>' + esc(p.제목 || '평면 손그림') + '</h2><img alt="실측 평면 손그림" src="' + p.그림 + '"></div>'; });
    (D.공간 || []).forEach(function (r) {
      h += '<div class="card"><h2>' + esc(r.공간 || '공간') + (r.용도 ? ' <small>' + esc(r.용도) + '</small>' : '') + '</h2><div class="dim">' +
        '<span class="k">가로 × 세로</span><span class="v">' + m1(r.가로) + ' × ' + m1(r.세로) + ' m</span>' +
        (r.높이 ? '<span class="k">천장 높이</span><span class="v">' + m1(r.높이) + ' m</span>' : '') +
        '<span class="k">바닥 면적</span><span class="v">' + r.바닥 + '㎡ (' + r.평 + '평)</span>' +
        (r.벽 ? '<span class="k">벽 면적</span><span class="v">' + r.벽 + '㎡ <span style="font-weight:400;color:var(--mute);font-size:12.5px">문·창 뺌</span></span>' : '') + '</div>' +
        (r.메모 ? '<div class="memo">' + esc(r.메모) + '</div>' : '') +
        ((r.항목 || []).length ? '<div class="items">' + r.항목.map(itemHtml).join('') + '</div>' : '') + '</div>';
    });
    if ((D.기타 || []).length) {
      var g = {}; D.기타.forEach(function (it) { var n = it.공간 || '기타'; (g[n] = g[n] || []).push(it); });
      Object.keys(g).forEach(function (n) { h += '<div class="card"><h2>' + esc(n) + '</h2><div class="items" style="border:0;margin:0;padding:0">' + g[n].map(itemHtml).join('') + '</div></div>'; });
    }
    if (D.상담) {
      var c = D.상담;
      h += '<div class="card"><h2>상담 때 말씀하신 내용</h2>' +
        ((c.공정 || []).length ? '<div style="font-size:13px;color:var(--mute);margin-bottom:2px">필요한 공정</div><div class="items" style="border:0;margin:0;padding:0">' + c.공정.map(function (t) { return '<div class="it"><div><div class="n">' + esc(t.공종) + '</div>' + ((t.세부 || []).length ? '<div class="s">' + t.세부.map(esc).join(' · ') + '</div>' : '') + (t.메모 ? '<div class="s">' + esc(t.메모) + '</div>' : '') + '</div></div>'; }).join('') + '</div>' : '') +
        ((c.요청 || []).length ? '<div style="font-size:13px;color:var(--mute);margin:10px 0 2px">요청·필요 사항</div><div class="items" style="border:0;margin:0;padding:0">' + c.요청.map(function (t) { return '<div class="it"><div><div class="n">' + esc(t.항목) + '</div>' + (t.메모 ? '<div class="s">' + esc(t.메모) + '</div>' : '') + '</div></div>'; }).join('') + '</div>' : '') +
        (c.메모 ? '<div class="memo" style="color:var(--ink)">' + esc(c.메모) + '</div>' : '') + '</div>';
    }
    if (!(D.공간 || []).length && !(D.기타 || []).length && !D.상담) h += '<div class="card"><p>아직 정리된 실측 내용이 없습니다. 잠시 뒤 다시 열어 주세요.</p></div>';
    h += '<div id="ack"></div>';
    $('app').innerHTML = h; ack();
  }
  function ack() {
    var a = $('ack');
    if (D.확인 === '확인') { a.innerHTML = '<div class="card ok"><h2>확인해 주셔서 감사합니다</h2><p>' + esc(D.확인시각) + ' 확인 · 이 치수로 정밀 견적서를 만들어 보내 드리겠습니다.</p><p class="small">다시 고칠 곳이 생기면 코디(' + esc(D.코디) + ')에게 연락 주세요.</p></div>'; return; }
    if (D.확인 === '수정요청') { a.innerHTML = '<div class="card ok"><h2>고칠 곳을 받았습니다</h2><p style="white-space:pre-wrap">' + esc(D.메모) + '</p><p class="small">' + esc(D.확인시각) + ' · 확인 후 고쳐서 다시 알려 드리겠습니다.</p></div>'; return; }
    a.innerHTML = '<div class="card"><h2>실측 내용 확인</h2><p style="font-size:14px">위 치수·문창과 상담 내용이 맞는지 확인해 주세요.</p>' +
      '<button class="btn main" id="okBtn">확인했습니다</button>' +
      '<button class="btn" style="margin-top:8px" id="fixBtn">고칠 곳이 있어요</button>' +
      '<div id="fixBox" style="display:none"><textarea id="memo" placeholder="예) 작은방 창문은 교체하지 않아요 / 욕실 문 열리는 방향이 반대예요"></textarea><button class="btn main" id="fixSend">고칠 곳 보내기</button></div>' +
      '<div class="msg" id="msg"></div></div>';
    $('okBtn').onclick = function () { send('확인', ''); };
    $('fixBtn').onclick = function () { $('fixBox').style.display = ''; $('memo').focus(); };
    $('fixSend').onclick = function () { var m = $('memo').value.trim(); if (!m) { $('msg').textContent = '고칠 곳을 적어 주세요.'; return; } send('수정요청', m); };
  }
  function send(kind, memo) {
    ['okBtn', 'fixBtn', 'fixSend'].forEach(function (i) { if ($(i)) $(i).disabled = true; }); $('msg').textContent = '보내는 중…';
    fetch(EXEC + '?type=ms_ok', { method: 'POST', redirect: 'follow', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ k: k, 결과: kind, 메모: memo }) })
      .then(function (r) { return r.json(); }).then(function (d) {
        if (!d || d.ok === false) throw new Error((d && d.err) || '보내지 못했습니다.');
        D.확인 = d.확인; D.확인시각 = d.확인시각; D.메모 = memo; ack(); $('ack').scrollIntoView({ behavior: 'smooth' });
      }).catch(function (e) { ['okBtn', 'fixBtn', 'fixSend'].forEach(function (i) { if ($(i)) $(i).disabled = false; }); $('msg').textContent = e.message || '인터넷 연결을 확인하고 다시 눌러 주세요.'; });
  }
})();
</script>
</body>
</html>
